<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rajdhani:wght@500;700&display=swap');

    :root {
        --bg-color: #070705;
        --box-bg: #11110c;
        --gold-primary: #ffe680;
        --gold-secondary: #e6c547;
        --gold-bright: #ffdf40;
        --gold-glow: rgba(230, 197, 71, 0.5);
        --border-color: rgba(230, 197, 71, 0.35);
        --text-color: #ffffff;
        --text-muted: #b5b5a8;
    }

    * { box-sizing: border-box; }

    body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family: 'Cairo', 'Rajdhani', -apple-system, sans-serif;
        text-align: center;
        user-select: none;
        -webkit-user-select: none;
        padding: 15px;
        margin: 0;
        padding-bottom: 60px;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
    }

    button, select, input[type="range"], .bubble-select-trigger, .bubble-option, .controls label, .color-swatch, #channelLink, .history-btn, .history-btn-small, .bot-inline-link {
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
        user-select: none;
    }

    button:focus, select:focus, .bubble-select-trigger:focus, .bubble-option:focus, .controls label:focus, .color-swatch:focus, #channelLink:focus, .history-btn:focus {
        outline: none !important;
        box-shadow: 0 0 0 2px var(--gold-bright), 0 0 25px var(--gold-glow) !important;
    }

    h1, h2, h3, h4, h5, h6, p, label, .title, .copy-hint, .lang-box, .bubble-select-trigger, .bubble-option, .history-item, #channelBar, #introMessage {
        user-select: none !important;
        -webkit-user-select: none !important;
    }

    #output, #output * {
        user-select: text !important;
        -webkit-user-select: text !important;
    }

    body.modal-open { overflow: hidden !important; height: 100vh !important; touch-action: none !important; }

    body:not(.site-ready) > *:not(#langModal) { visibility: hidden; opacity: 0; }
    body.site-ready > *:not(#langModal):not(#secretBanner) { animation: pageReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

    @keyframes pageReveal {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* --- TOP BAR & CHANNEL --- */
    #channelBar {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 0 auto 15px auto;
        position: relative;
        z-index: 1000;
    }

    #channelLink, .history-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 22px;
        border-radius: 40px;
        border: 2px solid var(--gold-secondary);
        background: linear-gradient(135deg, rgba(230,197,71,0.25), rgba(255,230,128,0.08));
        color: var(--gold-primary);
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    #channelLink:hover, .history-btn:hover {
        transform: translateY(-3px);
        background: linear-gradient(135deg, rgba(230,197,71,0.45), rgba(255,230,128,0.2));
        border-color: #fff;
        box-shadow: 0 6px 30px var(--gold-glow);
    }

    /* --- INTRO BANNER --- */
    #introMessage {
        display: none;
        width: min(520px, 96%);
        margin: 0 auto 18px auto;
        padding: 16px 20px;
        background: linear-gradient(145deg, #14140f, #0a0a07);
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--gold-bright);
        border-right: 4px solid var(--gold-bright);
        border-radius: 16px;
        color: #f0f0e6;
        font-size: 14px;
        line-height: 1.8;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.7);
    }

    .bot-inline-link {
        color: var(--gold-bright);
        font-weight: 700;
        text-decoration: none !important;
        cursor: pointer;
        transition: 0.2s;
    }
    .bot-inline-link:hover { color: #fff; }

    /* --- LANGUAGE MODAL --- */
    #langModal {
        position: fixed;
        inset: 0;
        width: 100%; height: 100%;
        background: rgba(5, 5, 4, 0.9);
        backdrop-filter: blur(14px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 12000;
        animation: modalFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lang-box {
        background: linear-gradient(145deg, #181810, #0d0d09);
        backdrop-filter: blur(20px);
        padding: 38px 28px;
        border-radius: 28px;
        border: 2px solid var(--gold-secondary);
        box-shadow: 0 25px 70px rgba(0,0,0,0.95), 0 0 50px var(--gold-glow);
        width: 90%;
        max-width: 380px;
        animation: popupScale 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popupScale { from { opacity: 0; transform: scale(0.75) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    #langModal.lang-closing { animation: modalFadeOut 0.25s ease forwards; }
    #langModal.lang-closing .lang-box { animation: popupClose 0.25s ease forwards; }
    @keyframes modalFadeOut { to { opacity: 0; } }
    @keyframes popupClose { to { opacity: 0; transform: scale(0.95) translateY(-10px); } }

    .lang-box h2 {
        color: var(--gold-primary);
        margin-bottom: 24px;
        font-size: 21px;
        text-shadow: 0 2px 15px rgba(230,197,71,0.6);
    }

    .lang-btn {
        width: 100%;
        padding: 15px;
        margin: 10px 0;
        border-radius: 16px;
        border: 2px solid var(--gold-secondary);
        background: linear-gradient(135deg, rgba(230,197,71,0.15), rgba(255,255,255,0.03));
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 700;
    }

    .lang-btn:hover {
        background: linear-gradient(135deg, var(--gold-bright), #fff);
        color: #070705;
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 8px 25px var(--gold-glow);
    }

    /* --- MAIN BOX CONTAINER --- */
    .box {
        background: linear-gradient(160deg, #14140e, #0a0a06);
        padding: 28px 22px;
        border-radius: 26px;
        max-width: 520px;
        margin: auto;
        box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1);
        border: 2px solid var(--border-color);
        position: relative;
    }

    .box::before {
        content: '';
        position: absolute;
        top: 0; left: 50%;
        transform: translateX(-50%);
        width: 140px; height: 3px;
        background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
        border-radius: 0 0 4px 4px;
    }

    .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
        direction: ltr;
    }

    html[dir="rtl"] .title-row { direction: ltr; }
    html[dir="ltr"] .title-row { direction: rtl; }

    h2.title {
        margin-top: 0;
        margin-bottom: 0;
        color: var(--gold-primary);
        letter-spacing: 1.5px;
        font-weight: 900;
        font-size: 20px;
        text-shadow: 0 2px 12px rgba(230,197,71,0.5);
    }

    /* --- INPUTS & SELECTS --- */
    input[type="text"], select {
        width: 100%;
        padding: 14px 16px;
        margin: 10px 0;
        border-radius: 14px;
        border: 2px solid rgba(230,197,71,0.4);
        background: #0a0a06;
        color: white;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
        box-sizing: border-box;
        -webkit-appearance: none;
        appearance: none;
    }

    input[type="text"]:focus, select:focus {
        border-color: var(--gold-bright);
        box-shadow: 0 0 20px var(--gold-glow);
        background: #11110b;
    }

    select {
        background-image: url("data:image/svg+xml;utf8,<svg fill='%23ffdf40' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 14px center;
        background-size: 22px;
    }

    .bubble-select {
        position: relative;
        width: 100%;
        margin: 12px auto;
        z-index: 20;
    }

    .bubble-select.is-open { z-index: 100; }
    .bubble-select-native { display: none !important; }

    .bubble-select-trigger {
        width: 100%;
        min-height: 52px;
        padding: 12px 45px 12px 18px;
        border: 2px solid rgba(230,197,71,0.5);
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(230,197,71,0.18), rgba(17,17,11,0.95));
        color: var(--gold-primary);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 5px 20px rgba(0,0,0,0.4);
        transition: all 0.25s;
    }

    .bubble-select-trigger::after {
        content: "▼";
        position: absolute;
        right: 18px;
        top: 15px;
        font-size: 14px;
        color: var(--gold-bright);
        transition: transform 0.25s;
    }

    .bubble-select.is-open .bubble-select-trigger {
        border-color: var(--gold-bright);
        box-shadow: 0 0 25px var(--gold-glow);
    }

    .bubble-select.is-open .bubble-select-trigger::after { transform: rotate(180deg); }

    .bubble-options {
        display: none;
        position: absolute;
        left: 0; right: 0;
        top: calc(100% + 8px);
        padding: 8px;
        border: 2px solid var(--gold-secondary);
        border-radius: 18px;
        background: rgba(14, 14, 9, 0.98);
        backdrop-filter: blur(18px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.85);
        animation: bubbleIn 0.22s ease both;
    }

    .bubble-select.is-open .bubble-options { display: grid; gap: 6px; }

    .bubble-option {
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 11px 14px;
        background: rgba(255,255,255,0.04);
        color: #ddd;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        transition: 0.2s;
        text-align: center;
    }

    .bubble-option:hover, .bubble-option.is-active {
        background: linear-gradient(135deg, rgba(230,197,71,0.4), rgba(255,230,128,0.15));
        color: var(--gold-bright);
        border-color: var(--gold-bright);
        transform: scale(1.01);
    }

    @keyframes bubbleIn { from { opacity: 0; transform: translateY(-8px) scale(0.97); } to { opacity: 1; transform: translateY(0); } }

    /* --- CONTROLS / CHECKBOXES GRID --- */
    .row {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin: 12px auto;
        flex-wrap: wrap;
        gap: 8px;
    }

    .controls {
        display: grid !important;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
    }

    .controls label {
        background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(230,197,71,0.1));
        padding: 8px 4px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 700;
        user-select: none;
        border: 2px solid rgba(230,197,71,0.3);
        transition: 0.25s;
        width: 100%;
        min-height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        line-height: 1.25;
        color: #eaeae0;
    }

    .controls label:nth-child(1), .controls label:nth-child(2), .controls label:nth-child(3) { grid-column: span 2; }
    .controls label:nth-child(4), .controls label:nth-child(5) { grid-column: span 3; }

    .controls label:hover {
        background: #191910;
        border-color: var(--gold-bright);
        color: var(--gold-bright);
        transform: translateY(-2px);
    }

    .controls input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px; 
        height: 18px;
        min-width: 18px;
        min-height: 18px;
        margin: 0 4px;
        border: 2px solid var(--gold-bright);
        border-radius: 50% !important;
        background: rgba(0,0,0,0.6);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: 0.25s;
    }

    .controls input[type="checkbox"]:checked {
        background: radial-gradient(circle, #fff 0 4px, transparent 4.5px), var(--gold-bright);
        box-shadow: 0 0 12px var(--gold-glow);
        transform: scale(1.1);
    }

    /* --- COLOR PICKERS --- */
    .color-pickers {
        direction: ltr;
        display: flex;
        justify-content: center;
        width: 100%;
        margin: 16px auto;
        gap: 10px;
    }

    .color-pickers div {
        flex: 1;
        display: flex;
        flex-direction: column;
        font-size: 12px;
        color: var(--text-muted);
        align-items: center;
        font-weight: 600;
    }

    .color-swatch {
        width: 100%;
        height: 60px;
        border-radius: 14px;
        background: none;
        cursor: pointer;
        padding: 0;
        margin-top: 6px;
        border: 2px solid var(--gold-secondary);
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: 0.25s;
    }

    .color-swatch:hover {
        transform: scale(1.04);
        border-color: var(--gold-bright);
        box-shadow: 0 0 25px var(--gold-glow);
    }

    #customColorsPanel {
        display: none;
        width: 100%;
        max-height: 150px;
        overflow-x: auto;
        margin: 12px auto;
        padding: 10px;
        gap: 8px;
        align-items: center;
        border: 2px solid rgba(230,197,71,0.4);
        border-radius: 16px;
        background: rgba(0,0,0,0.5);
    }

    #customColorsPanel.visible { display: flex; animation: bubbleIn 0.25s ease both; }

    .character-color {
        flex: 0 0 42px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: #ddd;
        font-size: 11px;
    }

    .character-color button {
        width: 36px; height: 36px;
        border: 2px solid var(--gold-bright);
        border-radius: 50%;
        cursor: pointer;
        transition: 0.2s;
    }

    .character-color button:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--gold-glow); }

    /* --- SLIDERS GROUPS --- */
    .sliders-group {
        display: none;
        flex-direction: column;
        width: 100%;
        margin: 15px auto;
        background: #070704;
        border-radius: 16px;
        padding: 15px 0;
        border: 2px solid rgba(230,197,71,0.3);
        overflow-x: auto;
    }

    .sliders-group h4 {
        text-align: center;
        width: 100%;
        margin: 0 0 12px 0;
        color: var(--gold-primary);
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .sliders-wrapper {
        display: flex;
        gap: 16px;
        padding: 0 15px;
        width: max-content;
        margin: 0 auto;
    }

    .slider-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        min-width: 35px;
    }

    .slider-col span {
        font-weight: 700;
        font-size: 16px;
        color: var(--gold-primary);
    }

    .slider-col input[type="range"] {
        -webkit-appearance: slider-vertical;
        writing-mode: bt-lr;
        height: 70px;
        width: 26px;
        cursor: pointer;
        accent-color: var(--gold-bright);
    }

    /* --- PREVIEW BOX (PRECISE 100% STRAIGHT UNDERLINE) --- */
    #preview, #preview * {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
    }

    #preview {
        font-size: 32px;
        padding: 22px 16px;
        background: linear-gradient(135deg, #070704, #11110a);
        border-radius: 16px;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        overflow-x: auto;
        white-space: nowrap;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.85), 0 0 20px rgba(230,197,71,0.12);
        border: 2px solid rgba(230,197,71,0.35);
        margin: 18px auto;
        direction: ltr;
        unicode-bidi: bidi-override;
        font-variant-ligatures: none;
    }

    .preview-line-container {
        display: inline-flex;
        align-items: flex-end;
        line-height: 1.2;
    }

    .preview-char-wrapper {
        display: inline-flex;
        align-items: flex-end;
        justify-content: center;
        position: relative;
        padding-bottom: 6px;
        line-height: 1;
    }

    .preview-char-wrapper.has-underline {
        background-image: linear-gradient(to right, var(--u-color), var(--u-color));
        background-position: bottom 0 left 0;
        background-size: 100% 4px;
        background-repeat: no-repeat;
    }

    .preview-char {
        display: inline-block;
        position: relative;
        transition: color 0.4s ease;
        unicode-bidi: bidi-override;
        line-height: 1;
    }

    .preview-sup { transform: translateY(-8px); font-size: 0.8em; }
    .preview-sub { transform: translateY(6px); font-size: 0.8em; }

    /* --- OUTPUT & COPY FX --- */
    #output {
        position: relative;
        background: #050503;
        padding: 16px;
        word-break: break-all;
        font-family: 'Rajdhani', monospace;
        color: var(--gold-primary);
        border-radius: 14px;
        cursor: pointer;
        border: 2px dashed rgba(230,197,71,0.5);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        font-size: 14px;
        margin-bottom: 6px;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        direction: ltr;
        text-align: left;
        box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    }

    #output:hover {
        background: #11110a;
        border-color: var(--gold-bright);
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 0 35px var(--gold-glow);
    }

    #output.copy-active { animation: goldCopyGlow 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    @keyframes goldCopyGlow {
        0% { transform: scale(0.97); border-color: var(--gold-bright); box-shadow: 0 0 0 0 rgba(255,223,64,0.9), inset 0 0 30px rgba(230,197,71,0.6); }
        30% { transform: scale(1.03); border-color: #fff; box-shadow: 0 0 50px 14px var(--gold-glow), inset 0 0 25px #fff; }
        100% { transform: scale(1); border-color: rgba(230,197,71,0.5); box-shadow: 0 5px 20px rgba(0,0,0,0.6); }
    }

    .copy-sparkle {
        position: absolute;
        pointer-events: none;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, var(--gold-bright) 60%, transparent 100%);
        animation: sparkleFly 0.75s ease-out forwards;
        z-index: 10;
    }

    @keyframes sparkleFly {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(0.3) rotate(0deg); }
        100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.8) rotate(180deg); }
    }

    .copy-hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 0;
        margin-bottom: 10px;
    }

    /* --- MODALS --- */
    #colorPickerModal, #historyModal {
        position: fixed;
        inset: 0;
        width: 100%; height: 100%;
        background: rgba(3,3,2,0.88);
        backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        padding: 10px;
        animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #colorPickerBox {
        width: min(360px, 92vw);
        max-height: calc(100dvh - 20px);
        overflow-y: auto;
        background: #11110c;
        border: 2px solid var(--gold-secondary);
        border-radius: 20px;
        padding: 14px 16px;
        box-shadow: 0 20px 70px rgba(0,0,0,0.95), 0 0 40px var(--gold-glow);
        animation: popupScale 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .history-box {
        width: min(420px, 95vw);
        max-height: calc(100dvh - 30px);
        overflow-y: auto;
        background: #11110c;
        border: 2px solid var(--gold-secondary);
        border-radius: 24px;
        padding: 20px;
        box-shadow: 0 20px 70px rgba(0,0,0,0.95), 0 0 40px var(--gold-glow);
        animation: popupScale 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .history-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 15px 0;
        max-height: 55vh;
        overflow-y: auto;
    }

    .history-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(230,197,71,0.3);

const LAM_ALEF = { "ا":{isolated:"ﻻ",final:"ﻼ"}, "أ":{isolated:"ﻷ",final:"ﻸ"}, "إ":{isolated:"ﻹ",final:"ﻺ"}, "آ":{isolated:"ﻵ",final:"ﻶ"}, "ٱ":{isolated:"ﻻ",final:"ﻼ"} };
const BRACKET_MAP = { "(":")", ")":"(", "[":"]", "]":"[", "{":"}", "}":"{", "<":">", ">":"<", "«":"»", "»":"«" };

function isArabicChar(char) {
    if (!char) return false;
    const code = char.codePointAt(0);
    return (code >= 0x0600 && code <= 0x06FF) || (code >= 0x0750 && code <= 0x077F) || (code >= 0xFB50 && code <= 0xFDFF) || (code >= 0xFE70 && code <= 0xFEFF);
}

function isTatweel(char) { return char === "ـ"; }
function hasArabicForm(char) { return Object.prototype.hasOwnProperty.call(ARABIC_FORMS, char); }
function isCombiningMark(char) { if (!char) return false; return /[\u0300-\u036F\u0610-\u061A\u064B-\u065F\u0670]/u.test(char); }

function makeUnits(text) {
    if (typeof Intl !== "undefined" && Intl.Segmenter) {
        try {
            return Array.from(new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(text), part => part.segment);
        } catch (e) {}
    }
    const chars = Array.from(text);
    const units = [];
    for (const char of chars) {
        if (isCombiningMark(char) && units.length) units[units.length - 1] += char;

}

function getBase(unit) { return Array.from(unit)[0] || ""; }
function getPreviousBase(units, index) { if (index - 1 < 0) return null; const b = getBase(units[index - 1]); return hasArabicForm(b) ? b : null; }
function getNextBase(units, index) { if (index + 1 >= units.length) return null; const b = getBase(units[index + 1]); return hasArabicForm(b) ? b : null; }

function joinsPrevious(prev, curr) {
    if (!prev || !curr || prev === "ء" || curr === "ء") return false;
    if (!hasArabicForm(prev) || !hasArabicForm(curr)) return false;
    return !ARABIC_NON_JOINING.has(prev);
}

function joinsNext(curr, next) {
    if (!curr || !next || curr === "ء" || next === "ء") return false;
    if (!hasArabicForm(curr) || !hasArabicForm(next)) return false;

function shapeArabicUnits(units) {

        if (base === "ل" && i + 1 < units.length) {

function processTextByCharacter(text) {

    const shapedUnits = shapeArabicUnits(units);
    const preprocessedUnits = shapedUnits.map(unit => {

function transformText(text) { return processTextByCharacter(text); }

function hslToHex(h, s, l) {

function hexToRgb(hex) {

            Math.round(a.b + factor * (b.b - a.b)).toString(16).padStart(2, "0")).toUpperCase();

function getWordIndicesForUnits(units, reverseWords = false) {

function calculateColor(index, length, wordIndex, reverseGradient = false) {
    const mode = gradientMode.value;
    const v1 = c1.value.replace("#", "").toUpperCase();
    const v2 = c2.value.replace("#", "").toUpperCase();

        }

    }
    if (mode === "perchar") return (customCharColors[index] || v1).replace("#", "").toUpperCase();
    if (mode === "perword") {

function calculateElevation(index, length) {

function calculateSmallness(index, length) {

    if (!isCustom) { wrapper.parentElement.style.display = "none"; return; }

function sliderHandler(e) {

function updateColorSwatches() {

    swatch2.style.background = c2.value;
    swatch3.style.background = c3.value;
    swatch4.style.background = c4.value;

function drawCustomColors(text) {
    if (gradientMode.value !== "perchar") return;
    customColorsPanel.classList.add("visible");
    customColorsPanel.innerHTML = "";
    const units = Array.isArray(text) ? text : makeUnits(String(text));
    let index = 0;
    for (const char of units) {

        swatch.onclick = () => {

        };

function drawCustomWordColors(words) {
    if (gradientMode.value !== "perword") return;
    customColorsPanel.classList.add("visible");
    customColorsPanel.innerHTML = "";
    words.forEach((word, wordIndex) => {
        const color = customWordColors[wordIndex] || c1.value || "#E6C547";

        const label = document.createElement("span"); label.innerText = word;
        const swatch = document.createElement("button"); swatch.type = "button"; swatch.style.background = color;
        const colorInput = document.createElement("input"); colorInput.type = "color"; colorInput.value = color; colorInput.hidden = true;
        swatch.onclick = () => {

        };

function updateUI() {
    const gMode = gradientMode.value;
    box1.style.display = (gMode === "rainbow" || gMode === "random" || gMode === "perchar" || gMode === "perword") ? "none" : "flex";
    box2.style.display = (gMode === "mono" || gMode === "rainbow" || gMode === "random" || gMode === "perchar" || gMode === "perword") ? "none" : "flex";
    box3.style.display = (gMode === "grad3" || gMode === "grad4") ? "flex" : "none";

function enhanceSelect(select) {
    const wrapper = document.createElement("div"); wrapper.className = "bubble-select";
    const trigger = document.createElement("button"); trigger.type = "button"; trigger.className = "bubble-select-trigger";
    const options = document.createElement("div"); options.className = "bubble-options";
    select.classList.add("bubble-select-native");
    select.parentNode.insertBefore(wrapper, select);
    wrapper.append(select, trigger, options);

    const refresh = () => {
        const selected = select.options[select.selectedIndex];
        trigger.innerText = selected ? selected.textContent.trim() : "";

    };

    Array.from(select.options).forEach(option => {

        btn.dataset.value = option.value; btn.innerText = option.textContent.trim();

const bubbleSelects = [enhanceSelect(gradientMode), enhanceSelect(elevationMode), enhanceSelect(smallnessMode)];
document.addEventListener("click", () => document.querySelectorAll(".bubble-select.is-open").forEach(w => w.classList.remove("is-open")));

function cleanUnusedColorCodes(code) {

const INITIAL_DEFAULT_NAME = "♛BMW✔️♛";
const INITIAL_DEFAULT_CODE = "[B][I][C][U][FFF000]♛[FF0000]B[0000FF]M[00FFFF]W[00FF00]✔️[FFF000]♛";
let initialDefaultActive = true;

function renderInitialDefault() {
    const colors = ["FFF000", "FF0000", "0000FF", "00FFFF", "00FF00", "FFF000"];
    const chars = ["♛", "B", "M", "W", "✔️", "♛"];
    let innerHTML = chars.map((c, i) => `<span class="preview-char-wrapper has-underline" style="--u-color: #${colors[i]};"><span class="preview-char" style="color:#${colors[i]};">${escapeHTML(makePreviewColorable(c))}</span></span>`).join("");
    preview.innerHTML = `<span class="preview-line-container"><b><i>${innerHTML}</i></b></span>`;
    currentGeneratedCode = INITIAL_DEFAULT_CODE;
    output.innerText = currentGeneratedCode;
}

function generateCode(processedText) {
    if (initialDefaultActive && input.value === INITIAL_DEFAULT_NAME) { renderInitialDefault(); return; }
    let resCode = "", resPreview = "";
    if (bold.checked) resCode += "[B]";
    if (italic.checked) resCode += "[I]";
    if (colorList.checked) resCode += "[C]";
    if (underline.checked) resCode += "[U]";
    if (strike.checked) resCode += "[S]";

    let lastHexForCode = "", lastHexForSpace = "E6C547", charIdx = 0;
    const textLenNoSpaces = processedText.filter(x => x !== " ").length;
    const hasArabicInput = Array.from(input.value || "").some(c => isArabicChar(c));
    const wordIndices = getWordIndicesForUnits(processedText, gradientMode.value === "perword" && hasArabicInput);

    for (let i = 0; i < processedText.length; i++) {
        const originalChar = processedText[i];
        if (originalChar === " ") {
            resCode += " ";
            const spaceClass = underline.checked ? "preview-char-wrapper has-underline" : "preview-char-wrapper";
            const spaceStyle = `--u-color: #${lastHexForSpace}; ${strike.checked ? "text-decoration: line-through;" : ""}`;
            resPreview += `<span class="${spaceClass}" style="${spaceStyle}"><span class="preview-char" style="color:#${lastHexForSpace};">&nbsp;</span></span>`;
            continue;
        }

        const currentHex = calculateColor(charIdx, textLenNoSpaces, wordIndices[i], hasArabicInput);
        lastHexForSpace = currentHex;
        const elev = calculateElevation(charIdx, textLenNoSpaces);

        if (currentHex !== lastHexForCode) { resCode += `[${currentHex}]`; lastHexForCode = currentHex; }

        let finalChar = originalChar;
        if (calculateSmallness(charIdx, textLenNoSpaces) === 1) finalChar = smallMap[originalChar] || originalChar;

        if (elev === 1) resCode += `[sup]${finalChar}[/sup]`;
        else if (elev === -1) resCode += `[sub]${finalChar}[/sub]`;
        else resCode += finalChar;

        let previewClass = "";
        if (elev === 1) previewClass = "preview-sup";
        else if (elev === -1) previewClass = "preview-sub";

        const wrapperClass = underline.checked ? "preview-char-wrapper has-underline" : "preview-char-wrapper";
        const wrapperStyle = `--u-color: #${currentHex}; ${strike.checked ? "text-decoration: line-through;" : ""}`;

        resPreview += `<span class="${wrapperClass}" style="${wrapperStyle}"><span class="preview-char ${previewClass}" style="color:#${currentHex};">${escapeHTML(makePreviewColorable(finalChar))}</span></span>`;
        charIdx++;
    }

    let htmlPreStart = "", htmlPreEnd = "";
    if (bold.checked) { htmlPreStart += "<b>"; htmlPreEnd = "</b>" + htmlPreEnd; }
    if (italic.checked) { htmlPreStart += "<i>"; htmlPreEnd = "</i>" + htmlPreEnd; }

    preview.innerHTML = `<span class="preview-line-container">${htmlPreStart}${resPreview}${htmlPreEnd}</span>`;
    currentGeneratedCode = cleanUnusedColorCodes(resCode);
    output.innerText = currentGeneratedCode;
}

[bold, italic, underline, strike, colorList, gradientMode, elevationMode, smallnessMode, c1, c2, c3, c4].forEach(el => {

/* COLOR PICKER LOGIC */
const colorPickerModal = document.getElementById("colorPickerModal");
const hueWheel = document.getElementById("hueWheel"), hueHandle = document.getElementById("hueHandle");
const svSquare = document.getElementById("svSquare"), svHandle = document.getElementById("svHandle");
const pickerPreview = document.getElementById("pickerPreview"), hexInput = document.getElementById("hexInput");
const applyColor = document.getElementById("applyColor"), cancelColor = document.getElementById("cancelColor"), closeColorPicker = document.getElementById("closeColorPicker");

let pickerTarget = null, pickerHue = 0, pickerSaturation = 1, pickerValue = 1, pickerCustomApply = null;

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function hexToHSV(hex) {
    let val = hex.replace("#", "").trim();
    if (!/^[0-9a-fA-F]{6}$/.test(val)) val = "E6C547";
    const r = parseInt(val.substring(0, 2), 16) / 255;
    const g = parseInt(val.substring(2, 4), 16) / 255;
    const b = parseInt(val.substring(4, 6), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d !== 0) {
        if (max === r) h = 60 * (((g - b) / d) % 6);
        else if (max === g) h = 60 * ((b - r) / d + 2);
        else h = 60 * ((r - g) / d + 4);
    }
    if (h < 0) h += 360;
    return { h, s: max === 0 ? 0 : d / max, v: max };
}

function hsvToHex(h, s, v) {
    const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
    const toHex = val => Math.round((val + m) * 255).toString(16).padStart(2, "0");
    return "#" + toHex(r) + toHex(g) + toHex(b);
}

function updatePicker() {
    const color = hsvToHex(pickerHue, pickerSaturation, pickerValue).toUpperCase();
    hexInput.value = color; pickerPreview.style.background = color;
    const pureColor = hsvToHex(pickerHue, 1, 1);
    svSquare.style.background = `linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, ${pureColor})`;
    const hueAngle = pickerHue * Math.PI / 180, wheelRadius = 42;
    hueHandle.style.left = (50 + wheelRadius * Math.sin(hueAngle)) + "%";
    hueHandle.style.top = (50 - wheelRadius * Math.cos(hueAngle)) + "%";
    svHandle.style.left = (pickerSaturation * 100) + "%";
    svHandle.style.top = ((1 - pickerValue) * 100) + "%";
}

function openColorPicker(target) {
    pickerTarget = target;
    const hsv = hexToHSV(target.value);
    pickerHue = hsv.h; pickerSaturation = hsv.s; pickerValue = hsv.v;
    updatePicker(); colorPickerModal.style.display = "flex"; updateModalLockState();
}

function closePicker() { colorPickerModal.style.display = "none"; pickerTarget = null; pickerCustomApply = null; updateModalLockState(); }

function setHueFromPointer(e) {
    const rect = hueWheel.getBoundingClientRect();
    const x = e.clientX - (rect.left + rect.width / 2), y = e.clientY - (rect.top + rect.height / 2);
    if (Math.sqrt(x * x + y * y) < rect.width * 0.25) return;
    let angle = Math.atan2(x, -y) * 180 / Math.PI;
    if (angle < 0) angle += 360;
    pickerHue = angle; updatePicker();
}

function setSVFromPointer(e) {
    const rect = svSquare.getBoundingClientRect();
    const x = clamp(e.clientX - rect.left, 0, rect.width), y = clamp(e.clientY - rect.top, 0, rect.height);
    pickerSaturation = x / rect.width; pickerValue = 1 - y / rect.height;
    updatePicker();
}

let hueDragging = false, svDragging = false;
hueWheel.addEventListener("pointerdown", e => { hueDragging = true; hueWheel.setPointerCapture(e.pointerId); setHueFromPointer(e); e.preventDefault(); });
hueWheel.addEventListener("pointermove", e => { if (hueDragging) { setHueFromPointer(e); e.preventDefault(); } });
hueWheel.addEventListener("pointerup", e => { hueDragging = false; });
hueWheel.addEventListener("pointercancel", e => { hueDragging = false; });

svSquare.addEventListener("pointerdown", e => { svDragging = true; svSquare.setPointerCapture(e.pointerId); setSVFromPointer(e); e.preventDefault(); });
svSquare.addEventListener("pointermove", e => { if (svDragging) { setSVFromPointer(e); e.preventDefault(); } });
svSquare.addEventListener("pointerup", e => { svDragging = false; });
svSquare.addEventListener("pointercancel", e => { svDragging = false; });

/* HISTORY PARSING HELPER */
function parseCodeToHTMLPreview(code) {
    if (!code) return "";
    let isB = false, isI = false, isU = false, isS = false;
    let currentColor = "E6C547";
    let lastColorForSpace = "E6C547";
    
    if (code.includes("[B]")) isB = true;
    if (code.includes("[I]")) isI = true;
    if (code.includes("[U]")) isU = true;
    if (code.includes("[S]")) isS = true;

    let tokens = code.split(/(\[[A-Z0-9#]+\]|\/sup|\/sub)/gi);
    let htmlResult = "";
    let supMode = false;
    let subMode = false;

    for (let token of tokens) {
        if (!token) continue;
        const upper = token.toUpperCase();
        if (upper === "[B]" || upper === "[I]" || upper === "[U]" || upper === "[S]" || upper === "[C]") continue;
        if (token.toLowerCase() === "[sup]") { supMode = true; continue; }
        if (token.toLowerCase() === "[/sup]") { supMode = false; continue; }
        if (token.toLowerCase() === "[sub]") { subMode = true; continue; }
        if (token.toLowerCase() === "[/sub]") { subMode = false; continue; }
        
        if (/^\[[0-9A-F]{6}\]$/i.test(token)) {
            currentColor = token.slice(1, 7);
            lastColorForSpace = currentColor;
            continue;
        }

        let units = makeUnits(token);
        for (let u of units) {
            if (u === " ") {
                let spaceClass = isU ? "preview-char-wrapper has-underline" : "preview-char-wrapper";
                let spaceStyle = `--u-color: #${lastColorForSpace}; ${isS ? "text-decoration: line-through;" : ""}`;
                htmlResult += `<span class="${spaceClass}" style="${spaceStyle}"><span class="preview-char" style="color:#${lastColorForSpace};">&nbsp;</span></span>`;
                continue;
            }
            lastColorForSpace = currentColor;
            let wrapperClass = isU ? "preview-char-wrapper has-underline" : "preview-char-wrapper";
            let wrapperStyle = `--u-color: #${currentColor}; ${isS ? "text-decoration: line-through;" : ""}`;
            
            let pClass = "";
            if (supMode) pClass = "preview-sup";
            else if (subMode) pClass = "preview-sub";

            htmlResult += `<span class="${wrapperClass}" style="${wrapperStyle}"><span class="preview-char ${pClass}" style="color:#${currentColor};">${escapeHTML(makePreviewColorable(u))}</span></span>`;
        }
    }

    let wrapped = htmlResult;
    if (isI) wrapped = `<i>${wrapped}</i>`;
    if (isB) wrapped = `<b>${wrapped}</b>`;
    return `<span class="preview-line-container">${wrapped}</span>`;
}

/* STORAGE & HISTORY */
const STORAGE_KEY = "cpm_saved_nicknames_elite";
function getCurrentState() {
    return {
        text: input.value, bold: bold.checked, italic: italic.checked, underline: underline.checked, strike: strike.checked, colorList: colorList.checked,
        gradientMode: gradientMode.value, elevationMode: elevationMode.value, smallnessMode: smallnessMode.value,
        c1: c1.value, c2: c2.value, c3: c3.value, c4: c4.value,
        customElevations: [...customElevations], customSmallness: [...customSmallness], customCharColors: [...customCharColors], customWordColors: [...customWordColors]
    };
}

function saveToHistory(text, code, state) {
    if (!code || !code.trim()) return;
    let history = [];
    try { history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { history = []; }
    if (history.length > 0 && history[0].code === code) return;
    history.unshift({ id: Date.now(), text, code, state: JSON.parse(JSON.stringify(state)) });
    if (history.length > 50) history.pop();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function getHistory() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; } }
function deleteHistoryItem(id) { localStorage.setItem(STORAGE_KEY, JSON.stringify(getHistory().filter(i => i.id !== id))); renderHistory(); }
function clearAllHistory() { localStorage.removeItem(STORAGE_KEY); renderHistory(); }

function restoreState(state) {
    if (!state) return;
    initialDefaultActive = false;
    input.value = state.text || "";
    bold.checked = !!state.bold; italic.checked = !!state.italic; underline.checked = !!state.underline; strike.checked = !!state.strike; colorList.checked = !!state.colorList;
    gradientMode.value = state.gradientMode || "grad3"; elevationMode.value = state.elevationMode || "normal"; smallnessMode.value = state.smallnessMode || "all_normal";
    c1.value = state.c1 || "#E6C547"; c2.value = state.c2 || "#FFFFFF"; c3.value = state.c3 || "#E6C547"; c4.value = state.c4 || "#E6C547";
    customElevations = state.customElevations ? [...state.customElevations] : [];
    customSmallness = state.customSmallness ? [...state.customSmallness] : [];
    customCharColors = state.customCharColors ? [...state.customCharColors] : [];
    customWordColors = state.customWordColors ? [...state.customWordColors] : [];
    if (typeof bubbleSelects !== "undefined") bubbleSelects.forEach(bs => bs.refresh());
    updateUI();
    document.getElementById("historyModal").style.display = "none";
    updateModalLockState();
}

function renderHistory() {
    const listEl = document.getElementById("historyList"), history = getHistory();
    if (history.length === 0) { listEl.innerHTML = `<div style="color:var(--text-muted); padding:20px;">${translations[currentLang].noSaved}</div>`; return; }
    let html = "";
    history.forEach(item => {
        let renderedName = parseCodeToHTMLPreview(item.code);
        html += `<div class="history-item">
            <div class="history-preview-box">${renderedName}</div>
            <div class="history-actions">
                <button type="button" class="history-btn-small delete" onclick="deleteHistoryItem(${item.id})">${translations[currentLang].delete}</button>
                <button type="button" class="history-btn-small copy" onclick="copyFromHistory('${escapeHTML(item.code).replace(/'/g, "\\'")}')">${translations[currentLang].copy}</button>
                <button type="button" class="history-btn-small edit" onclick="editHistoryItem(${item.id})">${translations[currentLang].edit}</button>
            </div>
        </div>`;
    });
    listEl.innerHTML = html;
}

window.editHistoryItem = id => { const item = getHistory().find(i => i.id === id); if (item && item.state) restoreState(item.state); };
window.copyFromHistory = async code => { await performCopyText(code); };

const historyModal = document.getElementById("historyModal"), historyBtn = document.getElementById("historyBtn"), closeHistory = document.getElementById("closeHistory"), clearHistoryBtn = document.getElementById("clearHistoryBtn");
historyBtn.onclick = () => { renderHistory(); historyModal.style.display = "flex"; updateModalLockState(); };
closeHistory.onclick = () => { historyModal.style.display = "none"; updateModalLockState(); };
clearHistoryBtn.onclick = clearAllHistory;
historyModal.onclick = e => { if (e.target === historyModal) { historyModal.style.display = "none"; updateModalLockState(); } };

/* SPARKLE COPY EFFECT */
function triggerCopyFX(e, container) {
    const rect = container.getBoundingClientRect();
    const clickX = e ? (e.clientX - rect.left) : (rect.width / 2);
    const clickY = e ? (e.clientY - rect.top) : (rect.height / 2);
    for (let i = 0; i < 15; i++) {
        const sparkle = document.createElement("div"); sparkle.className = "copy-sparkle";
        const angle = Math.random() * Math.PI * 2, dist = 35 + Math.random() * 65;
        sparkle.style.left = clickX + "px"; sparkle.style.top = clickY + "px";
        sparkle.style.width = (6 + Math.random() * 8) + "px"; sparkle.style.height = sparkle.style.width;
        sparkle.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        sparkle.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        container.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 750);
    }
    container.classList.remove("copy-active"); void container.offsetWidth; container.classList.add("copy-active");
}

async function performCopyText(text, eventTarget) {
    if (!text) return;
    let copied = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); copied = true; } } catch (e) { copied = false; }
    if (!copied) {
        const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { copied = document.execCommand("copy"); } catch (e) { copied = false; }
        document.body.removeChild(ta);
    }
    if (copied) {
        saveToHistory(input.value, text, getCurrentState());
        triggerCopyFX(eventTarget, output);
        output.innerText = translations[currentLang].copied;
        output.style.color = "#070705";
        output.style.background = "linear-gradient(135deg, var(--gold-bright), #fff)";
        setTimeout(() => { output.innerText = currentGeneratedCode; output.style.color = "var(--gold-primary)"; output.style.background = "#050503"; }, 1400);
    } else {
        alert(currentLang === "ar" ? "تعذر النسخ تلقائياً." : "Copy failed.");
    }
}

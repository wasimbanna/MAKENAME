<style>

    :root {
        --bg-color: #141410;
        --box-bg: #1d1d17;
        --border-color: #6A5ACD;
        --accent-color: #6A5ACD;
        --text-color: #ffffff;
        --text-muted: #aaaaaa;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;

        text-align: center;

        /* Keep all interface text non-selectable; code box is re-enabled below. */
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;

        padding: 20px;
        margin: 0;
        padding-bottom: 50px;

        overflow-x: hidden;

        -webkit-font-smoothing: antialiased;

        transition: background 0.3s;

        /* Keep the interface itself non-selectable. Code is explicitly
           re-enabled for manual selection in #output below. */
        -webkit-tap-highlight-color: transparent;
    }

    /* Prevent the browser's default blue touch/focus rectangle.
       Use a soft purple focus treatment that matches the site. */
    button,
    select,
    input[type="range"],
    .bubble-select-trigger,
    .bubble-option,
    .controls label,
    .color-swatch,
    #channelLink,
    .history-btn,
    .history-btn-small {
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
        -webkit-user-select: none;
        user-select: none;
    }

    button:focus,
    select:focus,
    .bubble-select-trigger:focus,
    .bubble-option:focus,
    .controls label:focus,
    .color-swatch:focus,
    #channelLink:focus,
    .history-btn:focus,
    .history-btn-small:focus {
        outline: none !important;
        box-shadow:
            0 0 0 2px rgba(106, 90, 205, 0.85),
            0 0 18px rgba(106, 90, 205, 0.28) !important;
    }

    /* Interface labels and decorative text cannot be selected.
       Editable nickname input and generated code remain usable. */
    h1, h2, h3, h4, h5, h6, p, label,
    .title, .copy-hint, .lang-box, .bubble-select-trigger,
    .bubble-option, .history-item, .history-actions,
    #channelBar, #introMessage, #preview {
        user-select: none !important;
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
    }

    /* The generated code remains the one selectable text area. */
    #output,
    #output * {
        user-select: text !important;
        -webkit-user-select: text !important;
        -moz-user-select: text !important;
        -ms-user-select: text !important;
    }

    /* Modal Lock Background Scroll */
    body.modal-open {
        overflow: hidden !important;
        height: 100vh !important;
        touch-action: none !important;
    }


    /* =====================================================
       INITIAL LANGUAGE LOCK & SMOOTH ENTRY
    ===================================================== */

    body:not(.site-ready) > *:not(#langModal) {
        visibility: hidden;
        opacity: 0;
    }

    body.site-ready > *:not(#langModal):not(#secretBanner) {
        animation: pageReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes pageReveal {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =====================================================
       CHANNEL & NAVBAR
    ===================================================== */

    #channelBar {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;

        margin: 0 auto 15px auto;

        position: relative;
        z-index: 1000;
        flex-wrap: wrap;
    }

    #channelLink, .history-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 9px 18px;

        border-radius: 30px;

        border: 1px solid var(--border-color);

        background:
            linear-gradient(
                45deg,
                rgba(106,90,205,0.20),
                rgba(255,105,180,0.15)
            );

        color: #ffffff;

        text-decoration: none;

        font-size: 14px;

        font-weight: bold;

        cursor: pointer;

        user-select: none;

        transition:
            transform 0.2s,
            background 0.2s,
            border-color 0.2s,
            box-shadow 0.2s;

        -webkit-tap-highlight-color: transparent;
    }

    #channelLink:hover, .history-btn:hover {
        transform: translateY(-2px);

        background:
            linear-gradient(
                45deg,
                rgba(106,90,205,0.45),
                rgba(255,105,180,0.30)
            );

        border-color: #FF69B4;
        box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
    }

    #channelLink:active, .history-btn:active {
        transform: scale(0.97);
    }


    /* =====================================================
       INTRO MESSAGE
    ===================================================== */

    #introMessage {
        display: none;

        width: min(500px, 95%);

        margin: 0 auto 15px auto;

        padding: 14px 18px;

        background: #1d1d17;

        border: 1px solid #333;

        border-left: 3px solid var(--border-color);
        border-right: 3px solid var(--border-color);

        border-radius: 12px;

        color: #eeeeee;

        font-size: 14px;

        line-height: 1.7;

        text-align: center;

        box-shadow:
            0 5px 20px
            rgba(0,0,0,0.35);
    }


    /* =====================================================
       LANGUAGE MODAL (FLUID ANIMATED POPUP)
    ===================================================== */

    #langModal {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        background: rgba(10, 10, 8, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        display: flex;
        justify-content: center;
        align-items: center;

        z-index: 12000;
        animation: modalFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lang-box {
        background: rgba(29, 29, 23, 0.95);
        backdrop-filter: blur(20px);

        padding: 35px 25px;

        border-radius: 24px;

        border: 1px solid rgba(180, 160, 255, 0.4);

        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.9),
            0 0 30px rgba(106, 90, 205, 0.25);

        width: 90%;
        max-width: 360px;
        animation: popupScale 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes popupScale {
        from { opacity: 0; transform: scale(0.78) translateY(18px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    #langModal.lang-closing {
        animation: modalFadeOut 0.26s ease forwards;
    }

    #langModal.lang-closing .lang-box {
        animation: popupClose 0.26s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes modalFadeOut {
        from { opacity: 1; }
        to { opacity: 0; }
    }

    @keyframes popupClose {
        from { opacity: 1; transform: scale(1) translateY(0); }
        to { opacity: 0; transform: scale(0.96) translateY(-8px); }
    }


    .lang-box h2 {
        color: #f3e5ab;

        margin-bottom: 22px;

        font-size: 20px;
        text-shadow: 0 2px 10px rgba(243, 229, 171, 0.3);
    }


    .lang-btn {
        width: 100%;

        padding: 14px;

        margin: 10px 0;

        border-radius: 14px;

        border: 1px solid var(--border-color);

        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(106,90,205,0.15));

        color: white;

        font-size: 16px;

        cursor: pointer;

        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

        font-weight: bold;
    }


    .lang-btn:hover {
        background: linear-gradient(135deg, var(--border-color), #ff69b4);

        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 20px rgba(106, 90, 205, 0.4);
    }


    /* =====================================================
       MAIN BOX
    ===================================================== */

    .box {
        background: var(--box-bg);

        padding: 25px;

        border-radius: 20px;

        max-width: 500px;

        margin: auto;

        box-shadow:
            0 10px 40px rgba(0, 0, 0, 0.9);

        border: 1px solid var(--border-color);
    }


    .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 8px;
        direction: ltr;
    }

    /* Arabic: clipboard on the left. English: clipboard on the right. */
    html[dir="rtl"] .title-row {
        direction: ltr;
    }

    html[dir="ltr"] .title-row {
        direction: rtl;
    }

    .title-row h2.title {
        margin-bottom: 0;
    }

    .title-row .history-btn {
        flex: 0 0 auto;
        padding: 7px 12px;
        font-size: 12px;
        border-radius: 20px;
        white-space: nowrap;
    }

    h2.title {
        margin-top: 0;

        color: #f3e5ab;

        letter-spacing: 2px;

        font-weight: 800;

        font-size: 22px;
    }


    /* =====================================================
       INPUT / SELECT
    ===================================================== */

    input[type="text"],
    select {

        width: 90%;

        padding: 12px;

        margin: 10px 0;

        border-radius: 8px;

        border: 1px solid #444;

        background: #24241e;

        color: white;

        font-size: 16px;

        outline: none;

        transition: 0.3s;

        box-sizing: border-box;

        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
    }


    input[type="text"]:focus,
    select:focus {

        border-color:
            var(--border-color);

        box-shadow:
            0 0 10px
            rgba(106, 90, 205, 0.4);
    }


    select {

        background-image:
            url("data:image/svg+xml;utf8,<svg fill='%23FFFFFF' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");

        background-repeat: no-repeat;

        background-position:
            right 10px center;

        background-size: 24px;
    }

    .bubble-select {
        position: relative;
        width: 90%;
        margin: 10px auto;
        z-index: 20;
    }

    .bubble-select.is-open {
        z-index: 100;
    }

    .bubble-select-native {
        display: none !important;
    }

    .bubble-select-trigger {
        width: 100%;
        min-height: 48px;
        padding: 11px 42px 11px 16px;
        border: 1px solid rgba(180, 160, 255, 0.55);
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(255,255,255,0.13), rgba(106,90,205,0.18));
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 5px 18px rgba(106,90,205,0.12);
        transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        -webkit-tap-highlight-color: transparent;
        outline: none;
    }

    .bubble-select-trigger:focus {
        outline: none !important;
        border-color: rgba(180, 160, 255, 0.85);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.16),
            0 0 0 2px rgba(106,90,205,0.72),
            0 8px 24px rgba(106,90,205,0.22);
    }

    .bubble-select-trigger::after {
        content: "⌄";
        position: absolute;
        right: 17px;
        top: 8px;
        font-size: 24px;
        color: #d7ccff;
        transition: transform 0.25s;
    }

    .bubble-select.is-open .bubble-select-trigger {
        transform: translateY(-2px);
        border-color: #ff69b4;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 8px 24px rgba(255,105,180,0.2);
    }

    .bubble-select.is-open .bubble-select-trigger::after {
        transform: rotate(180deg);
    }

    .bubble-options {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 7px);
        padding: 8px;
        border: 1px solid rgba(180,160,255,0.5);
        border-radius: 20px;
        background: rgba(29,29,23,0.96);
        backdrop-filter: blur(16px);
        box-shadow: 0 14px 35px rgba(0,0,0,0.55);
        animation: bubbleIn 0.22s ease both;
    }

    .bubble-select.is-open .bubble-options {
        display: grid;
        gap: 6px;
    }

    .bubble-option {
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 15px;
        padding: 10px 12px;
        background: rgba(255,255,255,0.06);
        color: #eee;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }

    .bubble-option:hover,
    .bubble-option.is-active {
        transform: scale(1.02);
        background: linear-gradient(135deg, rgba(106,90,205,0.5), rgba(255,105,180,0.3));
        border-color: rgba(255,255,255,0.45);
    }

    @keyframes bubbleIn {
        from { opacity: 0; transform: translateY(-7px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }


    /* =====================================================
       CONTROLS
    ===================================================== */

    .row {
        display: flex;

        justify-content: center;

        align-items: center;

        width: 90%;

        margin: 10px auto;

        flex-wrap: wrap;

        gap: 8px;
    }


    .controls {
        display: grid !important;

        grid-template-columns:
            repeat(6, 1fr);

        gap: 8px;
    }


    .controls label {

        background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(106,90,205,0.16));

        padding: 8px 6px;

        border-radius: 8px;

        cursor: pointer;

        font-size: 13px;

        user-select: none;

        border: 1px solid rgba(180,160,255,0.35);

        transition: 0.25s;

        flex: none !important;

        width: 100%;

        min-height: 62px;

        display: flex;

        justify-content: center;

        align-items: center;

        text-align: center;

        line-height: 1.35;

        -webkit-tap-highlight-color:
            transparent;
    }


    .controls label:nth-child(1),
    .controls label:nth-child(2),
    .controls label:nth-child(3) {
        grid-column: span 2;
    }


    .controls label:nth-child(4),
    .controls label:nth-child(5) {
        grid-column: span 3;
    }


    .controls label:hover {

        background: #33332a;

        border-color:
            var(--border-color);

        transform: translateY(-2px);
    }


    .controls input[type="checkbox"] {

        appearance: none;
        width: 18px;
        height: 18px;
        margin: 0 5px;
        border: 1px solid rgba(255,255,255,0.55);
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
    }

    .controls input[type="checkbox"]:checked {
        background:
            radial-gradient(
                circle,
                #ffffff 0 4px,
                transparent 4.5px
            ),
            linear-gradient(135deg, #6a5acd, #ff69b4);
        box-shadow: 0 0 0 3px rgba(255,105,180,0.14), 0 0 12px rgba(106,90,205,0.6);
        transform: scale(1.12);
    }

    /* =====================================================
       COLORS
    ===================================================== */

    .color-pickers {

        display: flex;

        justify-content: center;

        width: 90%;

        margin: 15px auto;

        gap: 10px;

        transition: 0.3s;
    }


    .color-pickers div {

        flex: 1;

        display: flex;

        flex-direction: column;

        font-size: 12px;

        color: var(--text-muted);

        align-items: center;
    }


    .color-swatch {

        width: 100%;

        height: 70px;

        border-radius: 12px;

        background: none;

        cursor: pointer;

        padding: 0;

        margin-top: 5px;

        border: 3px solid #444;

        box-shadow:
            0 0 0 2px
            rgba(255,255,255,0.05);

        transition:
            transform 0.2s,
            box-shadow 0.2s;
    }


    .color-swatch:hover {

        transform: scale(1.02);

        box-shadow:
            0 0 0 2px
            rgba(106,90,205,0.5);
    }


    .color-swatch:active {

        transform: scale(0.98);
    }

    #customColorsPanel {
        display: none;
        width: 90%;
        max-height: 150px;
        overflow-x: auto;
        margin: 12px auto;
        padding: 10px;
        gap: 8px;
        align-items: center;
        border: 1px solid rgba(180,160,255,0.35);
        border-radius: 18px;
        background: rgba(255,255,255,0.045);
        scrollbar-color: var(--border-color) transparent;
    }

    #customColorsPanel.visible {
        display: flex;
        animation: bubbleIn 0.25s ease both;
    }

    .character-color {
        flex: 0 0 42px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: #ddd;
        font-size: 11px;
    }

    .character-color button {
        width: 38px;
        height: 38px;
        border: 2px solid rgba(255,255,255,0.65);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0,0,0,0.35);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .character-color button:hover {
        transform: translateY(-3px) scale(1.08);
        box-shadow: 0 6px 15px rgba(255,105,180,0.35);
    }


    /* =====================================================
       MODALS & HISTORY DRAWER
    ===================================================== */

    #colorPickerModal, #historyModal {

        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        background:
            rgba(0,0,0,0.85);
        backdrop-filter: blur(10px);

        display: none;

        justify-content: center;

        align-items: center;

        z-index: 10000;

        padding: 10px;

        overflow-y: auto;
        animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }


    #colorPickerBox, .history-box {

        width: min(420px, 95vw);

        max-height: calc(100dvh - 30px);

        overflow-y: auto;

        background: #1d1d17;

        border: 1px solid
            var(--border-color);

        border-radius: 20px;

        padding: 18px;

        box-shadow:
            0 15px 60px
            rgba(0,0,0,0.9), 0 0 30px rgba(106, 90, 205, 0.2);

        animation: popupScale 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .history-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 15px 0;
        max-height: 55vh;
        overflow-y: auto;
        padding-right: 5px;
    }

    .history-item {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(180, 160, 255, 0.25);
        border-radius: 14px;
        padding: 12px;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: transform 0.2s, border-color 0.2s;
    }

    [dir="rtl"] .history-item {
        text-align: right;
    }

    .history-item:hover {
        border-color: var(--border-color);
        transform: translateY(-2px);
    }

    .history-code {
        font-family: monospace;
        font-size: 13px;
        color: #00ffcc;
        background: #0a0a08;
        padding: 8px 10px;
        border-radius: 8px;
        word-break: break-all;
        direction: ltr;
        text-align: left;
    }

    .history-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
    }

    .history-btn-small {
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.08);
        color: white;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
    }

    .history-btn-small.delete {
        background: rgba(255, 77, 77, 0.2);
        border-color: rgba(255, 77, 77, 0.4);
        color: #ff6666;
    }

    .history-btn-small.delete:hover {
        background: rgba(255, 77, 77, 0.5);
        color: white;
    }

    .history-btn-small.copy {
        background: rgba(106, 90, 205, 0.3);
        border-color: rgba(106, 90, 205, 0.6);
        color: #d7ccff;
    }

    .history-btn-small.copy:hover {
        background: var(--border-color);
        color: white;
    }

    .history-btn-small.edit {
        background: rgba(255, 105, 180, 0.25);
        border-color: rgba(255, 105, 180, 0.5);
        color: #ffb6c1;
    }

    .history-btn-small.edit:hover {
        background: #ff69b4;
        color: white;
    }

    .history-footer {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
    }

    .danger-btn {
        background: rgba(255, 77, 77, 0.15);
        border: 1px solid rgba(255, 77, 77, 0.4);
        color: #ff8888;
        padding: 8px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    .danger-btn:hover {
        background: #ff4d4d;
        color: white;
    }

    .empty-history {
        color: var(--text-muted);
        font-size: 14px;
        padding: 20px 0;

        position: relative;

        background:

                cyan,
                blue,
                magenta,
                red
            );

        cursor: crosshair;

        touch-action: none;

        user-select: none;
    }

        position: absolute;

        width: 58%;

        height: 58%;

        left: 21%;

        top: 21%;

        border-radius: 50%;

        background: #1d1d17;

        pointer-events: none;
    }


    .hue-handle {

        position: absolute;

        width: 22px;

        height: 22px;

        border-radius: 50%;

        border: 3px solid white;

        box-shadow:
            0 0 0 2px
            rgba(0,0,0,0.7);

        transform:
            translate(-50%, -50%);

        pointer-events: none;

        z-index: 3;
    }

    ===================================================== */

        width: 205px;

        max-width: 100%;

        aspect-ratio: 1;

        margin: 10px auto;

        position: relative;

        border-radius: 8px;

        overflow: hidden;

        cursor: crosshair;

        touch-action: none;

        user-select: none;

        background:

                to top,
                #000,
                transparent
            ),
            linear-gradient(
                to right,
                #fff,
                red

        height: 20px;

    ===================================================== */

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
    }

    .copy-sparkle {

            transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.8) rotate(180deg);

    }


    .copy-hint {

            lang === "ar" ? "rtl" : "ltr";

        .getElementById("htmlRoot")

    document
        .getElementById("mainTitle")

            translations[lang].title;


    document
        .getElementById("nickInput")
        .placeholder =
            translations[lang].placeholder;


    document
        .querySelectorAll("[data-i18n]")
        .forEach(el => {

            const key =
                el.getAttribute("data-i18n");

            if (
                translations[lang][key]
            ) {

                if (key === "intro") {

                    el.innerHTML =
                        translations[lang][key];

                } else {

                    el.innerText =
                        translations[lang][key];

    if (typeof bubbleSelects !== "undefined") {
        bubbleSelects.forEach(wrapper => {
            const select = wrapper.querySelector("select");
            const options = wrapper.querySelector(".bubble-options");
            options.querySelectorAll(".bubble-option").forEach(button => {
                const option = Array.from(select.options)
                    .find(item => item.value === button.dataset.value);

            });
            wrapper.refresh();
        });
    }

        document.getElementById(
            "introMessage"
        );

    introMessage.style.display =
        "block";


    updateUI();
}

const ARABIC_NON_JOINING = new Set([

    "ا",
    "آ",
    "أ",
    "إ",
    "ٱ",

    "د",
    "ذ",

/* =========================================================
   LAM ALEF
========================================================= */

const LAM_ALEF = {

    "ا": {
        isolated:"ﻻ",
        final:"ﻼ"
    },

    "أ": {
        isolated:"ﻷ",
        final:"ﻸ"
    },

    "إ": {
        isolated:"ﻹ",
        final:"ﻺ"
    },

    "آ": {
        isolated:"ﻵ",
        final:"ﻶ"
    },

    "ٱ": {
        isolated:"ﻻ",
        final:"ﻼ"
    }

};


/* =========================================================
   BRACKET MIRROR MAP
========================================================= */

const BRACKET_MAP = {
    "(": ")", ")": "(",
    "[": "]", "]": "[",
    "{": "}", "}": "{",
    "<": ">", ">": "<",
    "«": "»", "»": "«",
    "‹": "›", "›": "‹"
};


/* =========================================================
   ARABIC DETECTION
========================================================= */

function isArabicChar(char) {

    if (!char)
        return false;


    const code =
        char.codePointAt(0);


    return (

        /* Arabic */
        (code >= 0x0600 &&
         code <= 0x06FF)

        ||

        /* Arabic Supplement */
        (code >= 0x0750 &&
         code <= 0x077F)

        ||

        /* Arabic Extended */
        (code >= 0x0870 &&
         code <= 0x08FF)

        ||

        /* Presentation Forms A */
        (code >= 0xFB50 &&
         code <= 0xFDFF)

        ||

        /* Presentation Forms B */
        (code >= 0xFE70 &&
         code <= 0xFEFF)

    );
}


/* =========================================================
   TATWEEL
========================================================= */

function isTatweel(char) {

    return char === "ـ";
}


/* =========================================================
   HAS SHAPING FORM
========================================================= */

function hasArabicForm(char) {

    return Object.prototype.hasOwnProperty.call(
        ARABIC_FORMS,
        char
    );
}


/* =========================================================
   COMBINING MARK
========================================================= */

function isCombiningMark(char) {

    if (!char)
        return false;


    return /[\u0300-\u036F\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/u
        .test(char);
}


/* =========================================================
   MAKE UNITS
========================================================= */

function makeUnits(text) {

    const chars =
        Array.from(text);

    const units = [];


    for (const char of chars) {

        if (
            isCombiningMark(char) &&
            units.length
        ) {

            units[
                units.length - 1
            ] += char;

        } else {

            units.push(char);
        }
    }


    return units;
}


/* =========================================================
   GET BASE
========================================================= */

function getBase(unit) {

    return Array.from(unit)[0] || "";
}


/* =========================================================
   FIND PREVIOUS ARABIC BASE
========================================================= */

function getPreviousBase(
    units,
    index
) {

    if (index - 1 < 0)
        return null;

    const base =
        getBase(units[index - 1]);

    if (hasArabicForm(base))
        return base;

    return null;
}


/* =========================================================
   FIND NEXT ARABIC BASE
========================================================= */

function getNextBase(
    units,
    index
) {

    if (index + 1 >= units.length)
        return null;

    const base =
        getBase(units[index + 1]);

    if (hasArabicForm(base))
        return base;

    return null;
}


/* =========================================================
   JOIN PREVIOUS
========================================================= */

function joinsPrevious(
    previous,
    current
) {

    if (
        !previous ||
        !current
    )
        return false;


    /* Standalone hamza never joins on either side. */
    if (
        previous === "ء" ||
        current === "ء"
    )
        return false;


    if (
        !hasArabicForm(previous) ||
        !hasArabicForm(current)
    )
        return false;


    return !ARABIC_NON_JOINING.has(
        previous
    );
}


/* =========================================================
   JOIN NEXT
========================================================= */

function joinsNext(
    current,
    next
) {

    if (
        !current ||
        !next
    )
        return false;


    /* Standalone hamza never joins on either side. */
    if (
        current === "ء" ||
        next === "ء"
    )
        return false;


    if (
        !hasArabicForm(current) ||
        !hasArabicForm(next)
    )
        return false;


    return !ARABIC_NON_JOINING.has(
        current
    );
}


/* =========================================================
   SHAPE ARABIC UNITS IN CONTEXT
========================================================= */

function shapeArabicUnits(units) {

    const result = [];


    for (
        let i = 0;
        i < units.length;
        i++
    ) {

        const unit =
            units[i];

        const base =
            getBase(unit);

        const marks =
            unit.slice(base.length);


        if (
            !hasArabicForm(base)
        ) {

            result.push(unit);

            continue;
        }


        if (
            base === "ل" &&
            i + 1 < units.length
        ) {
            const nextUnit = units[i + 1];
            const nextBase = getBase(nextUnit);

            if (LAM_ALEF[nextBase]) {
                const previousBase =
                    getPreviousBase(units, i);

                result.push(
                    (
                        joinsPrevious(previousBase, "ل")
                            ? LAM_ALEF[nextBase].final
                            : LAM_ALEF[nextBase].isolated
                    ) +
                    marks +
                    nextUnit.slice(nextBase.length)
                );

                i++;
                continue;
            }
        }


        const previousBase =
            getPreviousBase(
                units,
                i
            );


        const nextBase =
            getNextBase(
                units,
                i
            );


        const connectPrev =
            joinsPrevious(
                previousBase,
                base
            );


        const connectNext =
            joinsNext(
                base,
                nextBase
            );


        let formIndex = 0;


        if (
            connectPrev &&
            connectNext
        ) {

            formIndex = 3;

        } else if (
            connectPrev
        ) {

            formIndex = 1;

        } else if (
            connectNext
        ) {

            formIndex = 2;

        } else {

            formIndex = 0;
        }


        result.push(
            ARABIC_FORMS[
                base
            ][formIndex] +
            marks
        );
    }


    return result;
}


/* =========================================================
   SWAP FORMS FOR LTR REVERSAL
========================================================= */

function swapArabicFormForLTR(unit) {

    const base = getBase(unit);
    const marks = unit.slice(base.length);

    if (hasArabicForm(base)) {
        const forms = ARABIC_FORMS[base];
        const rawChar = unit.slice(0, unit.length - marks.length);

        if (rawChar === forms[2]) {
            return forms[1] + marks;
        }
        if (rawChar === forms[1]) {
            return forms[2] + marks;
        }
    }

    return unit;
}


/* =========================================================
   PROCESS TEXT (BIDI & REVERSAL ENGINE)
========================================================= */

function processTextByCharacter(text) {

    if (!text)
        return [];

    const units =
        makeUnits(text);


    const containsArabic =
        units.some(u => {
            const b = getBase(u);
            return isArabicChar(b) && (hasArabicForm(b) || isTatweel(b));
        });


    if (!containsArabic) {

        return units;
    }


    /* 1. Shape Arabic characters in context */
    const shapedUnits =
        shapeArabicUnits(units);


    /* 2. Swap forms for LTR reversal and mirror brackets */
    const preprocessedUnits =
        shapedUnits.map(unit => {

            const swapped =
                swapArabicFormForLTR(unit);

            const base =
                getBase(swapped);


            if (BRACKET_MAP[base]) {

                return BRACKET_MAP[base] + swapped.slice(base.length);
            }

            return swapped;
        });


    /* 3. Chunk units into tokens (Latin/Number runs stay as LTR chunks) */
    const chunks = [];

    let currentLatinChunk = [];


    for (const u of preprocessedUnits) {

        const base =
            getBase(u);

        const isLatinOrDigit =
            /^[a-zA-Z0-9]$/.test(base);


        if (isLatinOrDigit) {

            currentLatinChunk.push(u);

        } else {

            if (currentLatinChunk.length) {

                chunks.push(currentLatinChunk);

                currentLatinChunk = [];
            }

            chunks.push([u]);
        }
    }


    if (currentLatinChunk.length) {

        chunks.push(currentLatinChunk);
    }


    /* 4. Reverse sequence of chunks */
    chunks.reverse();


    /* 5. Flatten chunks back into array of units */
    const finalOutput = [];

    for (const chunk of chunks) {

        finalOutput.push(...chunk);
    }


    return finalOutput;
}


/* =========================================================
   TRANSFORM
========================================================= */

function transformText(text) {

    return processTextByCharacter(
        text
    );
}


/* =========================================================
   COLORS
========================================================= */

function hslToHex(
    h,
    s,
    l
) {

    l /= 100;


    const a =
        s *
        Math.min(
            l,
            1 - l
        ) /
        100;


    const f = n => {

        const k =
            (n + h / 30) % 12;


        const color =
            l -
            a *
            Math.max(
                Math.min(
                    k - 3,
                    9 - k,
                    1
                ),
                -1
            );


        return Math
            .round(
                255 * color
            )
            .toString(16)
            .padStart(2, "0");
    };


    return (
        f(0) +
        f(8) +
        f(4)
    ).toUpperCase();
}


/* =========================================================
   HEX TO RGB
========================================================= */

function hexToRgb(hex) {

    hex =
        hex
            .replace("#", "")
            .padEnd(6, "0");


    return {

        r:
            parseInt(
                hex.substring(0, 2),
                16
            ),

        g:
            parseInt(
                hex.substring(2, 4),
                16
            ),

        b:
            parseInt(
                hex.substring(4, 6),
                16
            )

    };
}


/* =========================================================
   INTERPOLATE COLOR
========================================================= */

function interpolateColor(
    hex1,
    hex2,
    factor
) {

    const a =
        hexToRgb(hex1);

    const b =
        hexToRgb(hex2);


    return (

        Math.round(
            a.r +
            factor *
            (b.r - a.r)
        )
        .toString(16)
        .padStart(2, "0")


        +


        Math.round(
            a.g +
            factor *
            (b.g - a.g)
        )
        .toString(16)
        .padStart(2, "0")


        +


        Math.round(
            a.b +
            factor *
            (b.b - a.b)
        )
        .toString(16)
        .padStart(2, "0")

    ).toUpperCase();
}


/* =========================================================
   WORD INDEX MAPPING FOR UNITS
========================================================= */

function getWordIndicesForUnits(units, reverseWords = false) {
    const indices = [];
    let currentWordIdx = 0;
    let inWord = false;

    for (let i = 0; i < units.length; i++) {
        if (units[i] === " ") {
            if (inWord) {
                currentWordIdx++;
                inWord = false;
            }
            indices.push(-1);
        } else {
            inWord = true;
            indices.push(currentWordIdx);
        }
    }

    if (reverseWords && currentWordIdx > 0) {
        const wordCount = currentWordIdx + (inWord ? 1 : 0);

        return indices.map(index =>
            index === -1
                ? -1
                : wordCount - 1 - index
        );
    }

    return indices;
}


/* =========================================================
   CALCULATE COLOR
========================================================= */

function calculateColor(
    index,
    length,
    wordIndex
) {

    const mode =
        gradientMode.value;


    const v1 =
        c1.value
            .replace("#", "")
            .toUpperCase();


    const v2 =
        c2.value
            .replace("#", "")
            .toUpperCase();


    const v3 =
        c3.value
            .replace("#", "")
            .toUpperCase();


    if (
        mode === "rainbow"
    ) {

        return hslToHex(

            length > 1
                ? (
                    index /
                    (length - 1)
                  ) *
                  300
                : 0,

            100,

            50
        );
    }


    if (
        mode === "random"
    ) {

        while (
            randomColors.length <= index
        ) {

            randomColors.push(

                Math
                    .floor(
                        Math.random() *
                        16777215
                    )
                    .toString(16)
                    .padStart(6, "0")
                    .toUpperCase()
            );
        }


        return randomColors[index];
    }

    if (
        mode === "perchar"
    ) {
        return (
            customCharColors[index] ||
            v1
        ).replace("#", "").toUpperCase();
    }

    if (
        mode === "perword"
    ) {
        if (wordIndex !== undefined && wordIndex !== -1) {
            return (
                customWordColors[wordIndex] ||
                v1
            ).replace("#", "").toUpperCase();
        }
        return v1;
    }


    if (
        mode === "mono"
    )
        return v1;


    if (
        mode === "alt"
    ) {

        return (
            index % 2 === 0
                ? v1
                : v2
        );
    }


    const factor =
        length > 1
            ? index / (length - 1)
            : 0;


    if (
        mode === "grad2"
    ) {

        return interpolateColor(
            v1,
            v2,
            factor
        );
    }


    if (
        mode === "grad3"
    ) {

        return factor <= 0.5

            ? interpolateColor(
                v1,
                v2,
                factor * 2
              )

            : interpolateColor(
                v2,
                v3,
                (factor - 0.5) * 2
              );
    }


    return "FFFFFF";
}


/* =========================================================
   ELEVATION
========================================================= */

function calculateElevation(
    index,
    length
) {

    const mode =
        elevationMode.value;


    if (
        mode === "normal"
    )
        return 0;


    if (
        mode === "jump"
    ) {

        return (
            index % 2 === 0
                ? 0
                : 1
        );
    }


    const factor =
        length > 1
            ? index / (length - 1)
            : 0;


    if (
        mode === "rise"
    ) {

        return (
            Math.round(
                factor * 2
            ) - 1
        );
    }


    if (
        mode === "fall"
    ) {

        return (
            Math.round(
                (1 - factor) * 2
            ) - 1
        );
    }


    if (
        mode === "wave"
    ) {

        return Math.round(
            Math.sin(
                factor *
                Math.PI *
                2
            )
        );
    }


    if (
        mode === "custom"
    ) {

        return (
            customElevations[index] ||
            0
        );
    }


    return 0;
}


/* =========================================================
   SMALLNESS
========================================================= */

function calculateSmallness(
    index,
    length
) {

    const mode =
        smallnessMode.value;


    if (
        mode === "all_normal"
    )
        return 0;


    if (
        mode === "all_small"
    )
        return 1;


    if (
        mode === "jump"
    ) {

        return (
            index % 2 === 0
                ? 0
                : 1
        );
    }


    if (
        mode === "custom"
    ) {

        return (
            customSmallness[index] ||
            0
        );
    }


    return 0;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   DRAW SLIDERS
========================================================= */

function drawSliders(
    type,
    wrapper,
    arr,
    text
) {

    const isCustom =

        (
            type === "elevation" &&
            elevationMode.value === "custom"
        )

        ||

        (
            type === "smallness" &&
            smallnessMode.value === "custom"
        );


    if (!isCustom) {

        wrapper.parentElement.style.display =
            "none";

        return;
    }


    wrapper.parentElement.style.display =
        "flex";


    let html = "";


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const val =
            arr[i] || 0;


        const min =
            type === "elevation"
                ? -1
                : 0;


        html += `

            <div class="slider-col">

                <span>
                    ${escapeHTML(text[i])}
                </span>

                <input
                    type="range"
                    min="${min}"
                    max="1"
                    value="${val}"
                    data-idx="${i}"
                    data-type="${type}"
                >

            </div>
        `;
    }


    wrapper.innerHTML =
        html;


    wrapper
        .querySelectorAll(
            "input"
        )
        .forEach(inp => {

            inp.addEventListener(
                "input",
                sliderHandler
            );

            inp.addEventListener(
                "change",
                sliderHandler
            );

        });

    installSliderTouchGuard(wrapper);
}


/* =========================================================
   SLIDER HANDLE-ONLY TOUCH CONTROL
========================================================= */

function isPointerOnSliderThumb(event, slider) {
    const rect = slider.getBoundingClientRect();
    const min = Number(slider.min || 0);
    const max = Number(slider.max || 100);
    const value = Number(slider.value || 0);
    const range = max - min || 1;
    const fraction = (value - min) / range;
    const thumbY = rect.bottom - (fraction * rect.height);

    return Math.abs(event.clientY - thumbY) <= 16 &&
           event.clientX >= rect.left - 10 &&
           event.clientX <= rect.right + 10;
}

function installSliderTouchGuard(wrapper) {
    wrapper.querySelectorAll('input[type="range"]').forEach(slider => {
        slider.addEventListener("pointerdown", event => {
            if (!isPointerOnSliderThumb(event, slider)) {
                event.preventDefault();
                event.stopImmediatePropagation();
            }
        }, { passive: false });
    });
}

/* =========================================================
   SLIDER HANDLER

}

function enhanceSelect(select) {
    const wrapper = document.createElement("div");
    wrapper.className = "bubble-select";

    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "bubble-select-trigger";

    const options = document.createElement("div");
    options.className = "bubble-options";

    select.classList.add("bubble-select-native");
    select.parentNode.insertBefore(wrapper, select);
    wrapper.append(select, trigger, options);

    const refresh = () => {
        const selected = select.options[select.selectedIndex];
        trigger.innerText = selected ? selected.textContent.trim() : "";
        options.querySelectorAll(".bubble-option").forEach(button => {
            button.classList.toggle("is-active", button.dataset.value === select.value);
        });
    };

    Array.from(select.options).forEach(option => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bubble-option";
        button.dataset.value = option.value;
        button.innerText = option.textContent.trim();
        button.onclick = () => {
            select.value = option.value;
            select.dispatchEvent(new Event("input", { bubbles: true }));
            select.dispatchEvent(new Event("change", { bubbles: true }));
            wrapper.classList.remove("is-open");
            refresh();
        };
        options.appendChild(button);
    });

    trigger.onclick = event => {
        event.stopPropagation();
        document.querySelectorAll(".bubble-select.is-open").forEach(other => {
            if (other !== wrapper) other.classList.remove("is-open");
        });
        wrapper.classList.toggle("is-open");
    };

    wrapper.refresh = refresh;
    refresh();
    return wrapper;
}

];

function cleanUnusedColorCodes(code) {
    let cleaned = code;
    let previous;

    do {
        previous = cleaned;
        cleaned = cleaned.replace(
            /\[[0-9A-F]{6}\](?=\[[0-9A-F]{6}\])/g,
            ""
        );
    } while (cleaned !== previous);

    return cleaned.replace(
        /\[[0-9A-F]{6}\]$/g,
        ""
    );
}


/* =========================================================
   GENERATE CODE
========================================================= */

function generateCode(
    processedText
) {

    let resCode = "";

    let resPreview = "";


    if (
        bold.checked
    )
        resCode += "[b]";


    if (
        italic.checked
    )
        resCode += "[i]";


    if (
        underline.checked
    )
        resCode += "[u]";


    if (
        strike.checked
    )
        resCode += "[s]";


    if (
        colorList.checked
    )
        resCode += "[C]";


    let lastHex = "";

    let charIdx = 0;


    const textLenNoSpaces =
        processedText.filter(
            char =>
                char !== " "
        ).length;

    const hasArabicInput = Array.from(input.value || "").some(char => isArabicChar(char));

    const wordIndices = getWordIndicesForUnits(
        processedText,
        gradientMode.value === "perword" && hasArabicInput
    );


    for (
        let i = 0;
        i < processedText.length;
        i++
    ) {

        const originalChar =
            processedText[i];


        if (
            originalChar === " "
        ) {
            resCode += " ";
            resPreview += " ";

            continue;
        }


        const currentHex =
            calculateColor(
                charIdx,
                textLenNoSpaces,
                wordIndices[i]
            );


        const elev =
            calculateElevation(
                charIdx,
                textLenNoSpaces
            );


        if (
            currentHex !== lastHex
        ) {

            resCode +=
                `[${currentHex}]`;

            lastHex =
                currentHex;
        }


        let finalChar =
            originalChar;


        if (
            calculateSmallness(
                charIdx,
                textLenNoSpaces
            ) === 1
        ) {

            finalChar =
                smallMap[
                    originalChar
                ] ||
                originalChar;
        }


        if (
            elev === 1
        ) {

            resCode +=
                `[sup]${finalChar}[/sup]`;

        } else if (
            elev === -1
        ) {

            resCode +=
                `[sub]${finalChar}[/sub]`;

        } else {

            resCode +=
                finalChar;
        }


        let previewClass = "";


        if (
            elev === 1
        ) {

            previewClass =
                "preview-sup";

        } else if (
            elev === -1
        ) {

            previewClass =
                "preview-sub";
        }


        const textDeco = [];


        if (
            underline.checked
        )
            textDeco.push(
                "underline"
            );


        if (
            strike.checked
        )
            textDeco.push(
                "line-through"
            );


        const decoStyle =
            textDeco.length

                ? `text-decoration:${textDeco.join(" ")};`

                : "";


        const htmlChar =
            `<span
                class="preview-char ${previewClass}"
                style="
                    color:#${currentHex};
                    ${decoStyle}
                "
            >${escapeHTML(finalChar)}</span>`;


        resPreview +=
            htmlChar;


        charIdx++;
    }


    let htmlPreStart = "";

    let htmlPreEnd = "";


    if (
        bold.checked
    ) {

        htmlPreStart +=
            "<b>";

        htmlPreEnd =
            "</b>" +
            htmlPreEnd;
    }


    if (
        italic.checked
    ) {

        htmlPreStart +=
            "<i>";

        htmlPreEnd =
            "</i>" +
            htmlPreEnd;
    }


    preview.innerHTML =
        htmlPreStart +
        resPreview +
        htmlPreEnd;


    currentGeneratedCode =
        cleanUnusedColorCodes(resCode);


    output.innerText =
        currentGeneratedCode;
}

/* =========================================================
   CLAMP
========================================================= */

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


/* =========================================================
   HEX → HSV
========================================================= */

function hexToHSV(hex) {

    let value =
        hex
            .replace("#", "")
            .trim();


    if (
        !/^[0-9a-fA-F]{6}$/.test(value)
    ) {

        value =
            "6A5ACD";
    }


    const r =
        parseInt(
            value.substring(0, 2),
            16
        ) / 255;


    const g =
        parseInt(
            value.substring(2, 4),
            16
        ) / 255;


    const b =
        parseInt(
            value.substring(4, 6),
            16
        ) / 255;


    const max =
        Math.max(r, g, b);

    const min =
        Math.min(r, g, b);

    const d =
        max - min;


    let h = 0;


    if (d !== 0) {

        if (max === r) {

            h =
                60 *
                (
                    ((g - b) / d) % 6
                );

        } else if (max === g) {

            h =
                60 *
                (
                    (b - r) / d + 2
                );

        } else {

            h =
                60 *
                (
                    (r - g) / d + 4
                );
        }
    }


    if (h < 0)
        h += 360;


    const s =
        max === 0
            ? 0
            : d / max;


    return {
        h,
        s,
        v: max
    };
}


/* =========================================================
   HSV → HEX
========================================================= */

function hsvToHex(
    h,
    s,
    v
) {

    const c =
        v * s;

    const x =
        c *
        (
            1 -
            Math.abs(
                ((h / 60) % 2) - 1
            )
        );

    const m =
        v - c;


    let r = 0;

    let g = 0;

    let b = 0;


    if (h < 60) {

        r = c;

        g = x;

    } else if (h < 120) {

        r = x;

        g = c;

    } else if (h < 180) {

        g = c;

        b = x;

    } else if (h < 240) {

        g = x;

        b = c;

    } else if (h < 300) {

        r = x;

        b = c;

    } else {

        r = c;

        b = x;
    }


    const toHex =
        value =>
            Math.round(
                (value + m) * 255
            )
            .toString(16)
            .padStart(2, "0");


    return (
        "#" +
        toHex(r) +
        toHex(g) +
        toHex(b)
    ).toUpperCase();
}

/* =========================================================
   HUE POSITION
========================================================= */

function setHueFromPointer(
    event
) {

    const rect =
        hueWheel.getBoundingClientRect();


    const x =
        event.clientX -
        (
            rect.left +
            rect.width / 2
        );


    const y =
        event.clientY -
        (
            rect.top +
            rect.height / 2
        );


    const distance =
        Math.sqrt(
            x * x +
            y * y
        );


    if (
        distance <
        rect.width * 0.25
    )
        return;


    let angle =
        Math.atan2(
            x,
            -y
        ) *
        180 /
        Math.PI;


    if (angle < 0)
        angle += 360;


    pickerHue =
        angle;


    updatePicker();
}


/* =========================================================
   SV POSITION
========================================================= */

function setSVFromPointer(
    event
) {

    const rect =
        svSquare.getBoundingClientRect();


    const x =
        clamp(
            event.clientX -
            rect.left,
            0,
            rect.width
        );


    const y =
        clamp(
            event.clientY -
            rect.top,
            0,
            rect.height
        );


    pickerSaturation =
        x / rect.width;


    pickerValue =
        1 -
        y / rect.height;


    updatePicker();
}

function showBanner(message) {

    const banner =
        document.getElementById(
            "secretBanner"
        );

    /* Always anchor the notification to the viewport center.
       This avoids RTL/LTR or parent-direction affecting its position. */
    banner.style.left = "50%";
    banner.style.right = "auto";
    banner.style.transform = "translate3d(-50%, 0, 0)";
    banner.style.direction = currentLang === "ar" ? "rtl" : "ltr";

    banner.innerText =
        message;

    banner.classList.remove(
        "show"
    );

    void banner.offsetWidth;

    banner.classList.add(
        "show"
    );


    setTimeout(
        () => {

            banner.classList.remove(
                "show"
            );

        },
        1800
    );
}


/* =========================================================
   SILENT AUTO-SAVE & HISTORY MANAGEMENT
========================================================= */

const STORAGE_KEY = "cpm_saved_nicknames";

function getCurrentState() {
    return {
        text: input.value,
        bold: bold.checked,
        italic: italic.checked,
        underline: underline.checked,
        strike: strike.checked,
        colorList: colorList.checked,
        gradientMode: gradientMode.value,
        elevationMode: elevationMode.value,
        smallnessMode: smallnessMode.value,
        c1: c1.value,
        c2: c2.value,
        c3: c3.value,
        customElevations: [...customElevations],
        customSmallness: [...customSmallness],
        customCharColors: [...customCharColors],
        customWordColors: [...customWordColors]
    };
}

function saveToHistory(text, code, state) {
    if (!code || !code.trim()) return;

    let history = [];
    try {
        history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
        history = [];
    }

    if (history.length > 0 && history[0].code === code) {
        return; // Avoid identical consecutive saves
    }

    const newItem = {
        id: Date.now(),
        text: text,
        code: code,
        state: JSON.parse(JSON.stringify(state))
    };

    history.unshift(newItem);
    if (history.length > 50) history.pop(); // limit to 50 items

    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function getHistory() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
        return [];
    }
}

function deleteHistoryItem(id) {
    let history = getHistory().filter(item => item.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    renderHistory();
}

function clearAllHistory() {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
}

function restoreState(state) {
    if (!state) return;

    input.value = state.text || "";
    bold.checked = !!state.bold;
    italic.checked = !!state.italic;
    underline.checked = !!state.underline;
    strike.checked = !!state.strike;
    colorList.checked = !!state.colorList;
    gradientMode.value = state.gradientMode || "grad3";
    elevationMode.value = state.elevationMode || "normal";
    smallnessMode.value = state.smallnessMode || "all_normal";
    c1.value = state.c1 || "#FF0000";
    c2.value = state.c2 || "#0000FF";
    c3.value = state.c3 || "#00FFFF";

    customElevations = state.customElevations ? [...state.customElevations] : [];
    customSmallness = state.customSmallness ? [...state.customSmallness] : [];
    customCharColors = state.customCharColors ? [...state.customCharColors] : [];
    customWordColors = state.customWordColors ? [...state.customWordColors] : [];

    if (typeof bubbleSelects !== "undefined") {
        bubbleSelects.forEach(bs => bs.refresh());
    }

    updateUI();
    closeHistoryModal();
}

function renderHistory() {
    const listEl = document.getElementById("historyList");
    const history = getHistory();

    if (history.length === 0) {
        listEl.innerHTML = `<div class="empty-history" data-i18n="noSaved">${translations[currentLang].noSaved}</div>`;
        return;
    }

    let html = "";
    history.forEach(item => {
        html += `
            <div class="history-item">
                <div class="history-code">${escapeHTML(item.code)}</div>
                <div class="history-actions">
                    <button class="history-btn-small delete" onclick="deleteHistoryItem(${item.id})">${translations[currentLang].delete}</button>
                    <button class="history-btn-small copy" onclick="copyFromHistory('${escapeHTML(item.code).replace(/'/g, "\\'")}')">${translations[currentLang].copy}</button>
                    <button class="history-btn-small edit" onclick='editHistoryItem(${item.id})'>${translations[currentLang].edit}</button>
                </div>
            </div>
        `;
    });

    listEl.innerHTML = html;
}

window.editHistoryItem = function(id) {
    const history = getHistory();
    const item = history.find(i => i.id === id);
    if (item && item.state) {
        restoreState(item.state);
    }
};

window.copyFromHistory = async function(code) {
    await performCopyText(code);
};

const historyModal = document.getElementById("historyModal");
const historyBtn = document.getElementById("historyBtn");
const closeHistory = document.getElementById("closeHistory");
const clearHistoryBtn = document.getElementById("clearHistoryBtn");

function openHistoryModal() {
    renderHistory();
    historyModal.style.display = "flex";
    updateModalLockState();
}

function closeHistoryModal() {
    historyModal.style.display = "none";

}

historyBtn.onclick = openHistoryModal;
closeHistory.onclick = closeHistoryModal;
clearHistoryBtn.onclick = clearAllHistory;

historyModal.addEventListener("click", (e) => {

});


/* =========================================================
   ULTRA SPARKLE COPY FX & COPY EXECUTION
========================================================= */

function triggerCopyFX(e, container) {
    const rect = container.getBoundingClientRect();
    const clickX = e ? (e.clientX - rect.left) : (rect.width / 2);
    const clickY = e ? (e.clientY - rect.top) : (rect.height / 2);

    for (let i = 0; i < 14; i++) {
        const sparkle = document.createElement("div");
        sparkle.className = "copy-sparkle";
        
        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 60;
        const dx = Math.cos(angle) * dist + "px";
        const dy = Math.sin(angle) * dist + "px";
        const size = 6 + Math.random() * 10;

        sparkle.style.left = clickX + "px";
        sparkle.style.top = clickY + "px";
        sparkle.style.width = size + "px";
        sparkle.style.height = size + "px";
        sparkle.style.setProperty("--dx", dx);
        sparkle.style.setProperty("--dy", dy);

        container.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 750);
    }

    container.classList.remove("copy-active");
    void container.offsetWidth;
    container.classList.add("copy-active");
}

async function performCopyText(text, eventTarget) {
    if (!text) return;

    let copied = false;
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            copied = true;
        }
    } catch (error) {
        copied = false;
    }

    if (!copied) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            copied = document.execCommand("copy");
        } catch (error) {
            copied = false;
        }
        document.body.removeChild(textArea);
    }

    if (copied) {
        // Save only names that were actually copied successfully.
        saveToHistory(input.value, text, getCurrentState());
        triggerCopyFX(eventTarget, output);

        output.innerText = translations[currentLang].copied;
        output.style.color = "#fff";
        output.style.background = "linear-gradient(135deg, #4CAF50, #00b0ff)";

        setTimeout(() => {
            output.innerText = currentGeneratedCode;
            output.style.color = "#00ffcc";
            output.style.background = "#0a0a08";
        }, 1400);
    } else {
        alert(
            currentLang === "ar"
                ? "تعذر النسخ تلقائيًا. حدد النص ثم اضغط Ctrl+C."
                : "Automatic copying failed. Select the text and press Ctrl+C."
        );
    }
}

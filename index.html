<style>

    :root {
        --bg-color: #141410;
        --box-bg: #1d1d17;
        --border-color: #6A5ACD;
        --accent-color: #6A5ACD;
        --text-color: #ffffff;
        --text-muted: #aaaaaa;
    }

    * {
        box-sizing: border-box;
    }

    body {
        background: var(--bg-color);
        color: var(--text-color);
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;

        text-align: center;
        padding: 20px;
        margin: 0;
        padding-bottom: 50px;

        overflow-x: hidden;

        -webkit-font-smoothing: antialiased;

        transition: background 0.3s;
    }


    /* =====================================================
       CHANNEL LINK
    ===================================================== */

    #channelBar {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;

        margin: 0 auto 15px auto;

        position: relative;
        z-index: 1000;
    }

    #channelLink {
        display: inline-flex;
        align-items: center;
        justify-content: center;

        padding: 9px 18px;

        border-radius: 30px;

        border: 1px solid var(--border-color);

        background:
            linear-gradient(
                45deg,
                rgba(106,90,205,0.20),
                rgba(255,105,180,0.15)
            );

        color: #ffffff;

        text-decoration: none;

        font-size: 14px;

        font-weight: bold;

        cursor: pointer;

        user-select: none;

        transition:
            transform 0.2s,
            background 0.2s,
            border-color 0.2s;

        -webkit-tap-highlight-color: transparent;
    }

    #channelLink:hover {
        transform: translateY(-2px);

        background:
            linear-gradient(
                45deg,
                rgba(106,90,205,0.45),
                rgba(255,105,180,0.30)
            );

        border-color: #FF69B4;
    }

    #channelLink:active {
        transform: scale(0.97);
    }


    /* =====================================================
       INTRO MESSAGE
    ===================================================== */

    #introMessage {
        display: none;

        width: min(500px, 95%);

        margin: 0 auto 15px auto;

        padding: 14px 18px;

        background: #1d1d17;

        border: 1px solid #333;

        border-left: 3px solid var(--border-color);
        border-right: 3px solid var(--border-color);

        border-radius: 12px;

        color: #eeeeee;

        font-size: 14px;

        line-height: 1.7;

        text-align: center;

        box-shadow:
            0 5px 20px
            rgba(0,0,0,0.35);
    }


    /* =====================================================
       LANGUAGE MODAL
    ===================================================== */

    #langModal {
        position: fixed;
        inset: 0;

        width: 100%;
        height: 100%;

        background: rgba(10, 10, 8, 0.95);

        display: flex;
        justify-content: center;
        align-items: center;

        z-index: 12000;
    }


    .lang-box {
        background: var(--box-bg);

        padding: 30px;

        border-radius: 20px;

        border: 1px solid var(--border-color);

        box-shadow:
            0 10px 40px rgba(0, 0, 0, 0.9);

        width: 90%;
        max-width: 350px;
    }


    .lang-box h2 {
        color: #f3e5ab;

        margin-bottom: 20px;

        font-size: 20px;
    }


    .lang-btn {
        width: 100%;

        padding: 14px;

        margin: 10px 0;

        border-radius: 10px;

        border: 1px solid var(--border-color);

        background: #2a2a22;

        color: white;

        font-size: 16px;

        cursor: pointer;

        transition: 0.3s;

        font-weight: bold;
    }


    .lang-btn:hover {
        background: var(--border-color);

        transform: translateY(-2px);
    }


    /* =====================================================
       MAIN BOX
    ===================================================== */

    .box {
        background: var(--box-bg);

        padding: 25px;

        border-radius: 20px;

        max-width: 500px;

        margin: auto;

        box-shadow:
            0 10px 40px rgba(0, 0, 0, 0.9);

        border: 1px solid var(--border-color);
    }


    h2.title {
        margin-top: 0;

        color: #f3e5ab;

        letter-spacing: 2px;

        font-weight: 800;

        font-size: 22px;
    }


    /* =====================================================
       INPUT / SELECT
    ===================================================== */

    input[type="text"],
    select {

        width: 90%;

        padding: 12px;

        margin: 10px 0;

        border-radius: 8px;

        border: 1px solid #444;

        background: #24241e;

        color: white;

        font-size: 16px;

        outline: none;

        transition: 0.3s;

        box-sizing: border-box;

        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
    }


    input[type="text"]:focus,
    select:focus {

        border-color:
            var(--border-color);

        box-shadow:
            0 0 10px
            rgba(106, 90, 205, 0.4);
    }


    select {

        background-image:
            url("data:image/svg+xml;utf8,<svg fill='%23FFFFFF' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");

        background-repeat: no-repeat;

        background-position:
            right 10px center;

        background-size: 24px;
    }

    .bubble-select {
        position: relative;
        width: 90%;
        margin: 10px auto;
        z-index: 20;
    }

    .bubble-select.is-open {
        z-index: 100;
    }

    .bubble-select-native {
        display: none !important;
    }

    .bubble-select-trigger {
        width: 100%;
        min-height: 48px;
        padding: 11px 42px 11px 16px;
        border: 1px solid rgba(180, 160, 255, 0.55);
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(255,255,255,0.13), rgba(106,90,205,0.18));
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 5px 18px rgba(106,90,205,0.12);
        transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
    }

    .bubble-select-trigger::after {
        content: "⌄";
        position: absolute;
        right: 17px;
        top: 8px;
        font-size: 24px;
        color: #d7ccff;
        transition: transform 0.25s;
    }

    .bubble-select.is-open .bubble-select-trigger {
        transform: translateY(-2px);
        border-color: #ff69b4;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 8px 24px rgba(255,105,180,0.2);
    }

    .bubble-select.is-open .bubble-select-trigger::after {
        transform: rotate(180deg);
    }

    .bubble-options {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 7px);
        padding: 8px;
        border: 1px solid rgba(180,160,255,0.5);
        border-radius: 20px;
        background: rgba(29,29,23,0.96);
        backdrop-filter: blur(16px);
        box-shadow: 0 14px 35px rgba(0,0,0,0.55);
        animation: bubbleIn 0.22s ease both;
    }

    .bubble-select.is-open .bubble-options {
        display: grid;
        gap: 6px;
    }

    .bubble-option {
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 15px;
        padding: 10px 12px;
        background: rgba(255,255,255,0.06);
        color: #eee;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }

    .bubble-option:hover,
    .bubble-option.is-active {
        transform: scale(1.02);
        background: linear-gradient(135deg, rgba(106,90,205,0.5), rgba(255,105,180,0.3));
        border-color: rgba(255,255,255,0.45);
    }

    @keyframes bubbleIn {
        from { opacity: 0; transform: translateY(-7px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }


    /* =====================================================
       CONTROLS
    ===================================================== */

    .row {
        display: flex;

        justify-content: center;

        align-items: center;

        width: 90%;

        margin: 10px auto;

        flex-wrap: wrap;

        gap: 8px;
    }


    .controls {
        display: grid !important;

        grid-template-columns:
            repeat(6, 1fr);

        gap: 8px;
    }


    .controls label {

        background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(106,90,205,0.16));

        padding: 8px 6px;

        border-radius: 8px;

        cursor: pointer;

        font-size: 13px;

        user-select: none;

        border: 1px solid rgba(180,160,255,0.35);

        transition: 0.25s;

        flex: none !important;

        width: 100%;

        min-height: 62px;

        display: flex;

        justify-content: center;

        align-items: center;

        text-align: center;

        line-height: 1.35;

        -webkit-tap-highlight-color:
            transparent;
    }


    .controls label:nth-child(1),
    .controls label:nth-child(2),
    .controls label:nth-child(3) {
        grid-column: span 2;
    }


    .controls label:nth-child(4),
    .controls label:nth-child(5) {
        grid-column: span 3;
    }


    .controls label:hover {

        background: #33332a;

        border-color:
            var(--border-color);

        transform: translateY(-2px);
    }


    .controls input[type="checkbox"] {

        appearance: none;
        width: 18px;
        height: 18px;
        margin: 0 5px;
        border: 1px solid rgba(255,255,255,0.55);
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        cursor: pointer;
        flex-shrink: 0;
        transition: transform 0.25s, background 0.25s, box-shadow 0.25s;
    }

    .controls input[type="checkbox"]:checked {
        background:
            radial-gradient(
                circle,
                #ffffff 0 4px,
                transparent 4.5px
            ),
            linear-gradient(135deg, #6a5acd, #ff69b4);
        box-shadow: 0 0 0 3px rgba(255,105,180,0.14), 0 0 12px rgba(106,90,205,0.6);
        transform: scale(1.12);
    }

    /* =====================================================
       COLORS
    ===================================================== */

    .color-pickers {

        display: flex;

        justify-content: center;

        width: 90%;

        margin: 15px auto;

        gap: 10px;

        transition: 0.3s;
    }


    .color-pickers div {

        flex: 1;

        display: flex;

        flex-direction: column;

        font-size: 12px;

        color: var(--text-muted);

        align-items: center;
    }


    .color-swatch {

        width: 100%;

        height: 70px;

        border-radius: 12px;

        background: none;

        cursor: pointer;

        padding: 0;

        margin-top: 5px;

        border: 3px solid #444;

        box-shadow:
            0 0 0 2px
            rgba(255,255,255,0.05);

        transition:
            transform 0.2s,
            box-shadow 0.2s;
    }


    .color-swatch:hover {

        transform: scale(1.02);

        box-shadow:
            0 0 0 2px
            rgba(106,90,205,0.5);
    }


    .color-swatch:active {

        transform: scale(0.98);
    }

    #customColorsPanel {
        display: none;
        width: 90%;
        max-height: 150px;
        overflow-x: auto;
        margin: 12px auto;
        padding: 10px;
        gap: 8px;
        align-items: center;
        border: 1px solid rgba(180,160,255,0.35);
        border-radius: 18px;
        background: rgba(255,255,255,0.045);
        scrollbar-color: var(--border-color) transparent;
    }

    #customColorsPanel.visible {
        display: flex;
        animation: bubbleIn 0.25s ease both;
    }

    .character-color {
        flex: 0 0 42px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: #ddd;
        font-size: 11px;
    }

    .character-color button {
        width: 38px;
        height: 38px;
        border: 2px solid rgba(255,255,255,0.65);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0,0,0,0.35);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .character-color button:hover {
        transform: translateY(-3px) scale(1.08);
        box-shadow: 0 6px 15px rgba(255,105,180,0.35);
    }


    /* =====================================================
       CUSTOM COLOR PICKER MODAL
    ===================================================== */

    #colorPickerModal {

        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        background:
            rgba(0,0,0,0.82);

        display: none;

        justify-content: center;

        align-items: center;

        z-index: 10000;

        padding: 10px;

        overflow-y: auto;
    }


    #colorPickerBox {

        width: min(360px, 95vw);

        max-height: calc(100dvh - 20px);

        overflow-y: auto;

        background: #1d1d17;

        border: 1px solid
            var(--border-color);

        border-radius: 20px;

        padding: 14px;

        box-shadow:
            0 15px 60px
            rgba(0,0,0,0.9);
    }


    .picker-header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 12px;

        font-weight: bold;

        color: #f3e5ab;

        font-size: 17px;
    }


    #closeColorPicker {

        border: none;

        background: transparent;

        color: white;

        font-size: 30px;

        line-height: 1;

        cursor: pointer;

        padding: 0 5px;
    }


    /* =====================================================
       HUE WHEEL
    ===================================================== */

    .hue-wheel {

        width: 205px;

        height: 205px;

        max-width: 100%;

        margin: 10px auto;

        border-radius: 50%;

        position: relative;

        background:
            conic-gradient(
                red,
                yellow,
                lime,
                cyan,
                blue,
                magenta,
                red
            );

        cursor: crosshair;

        touch-action: none;

        user-select: none;
    }


    .hue-wheel-inner {

        position: absolute;

        width: 58%;

        height: 58%;

        left: 21%;

        top: 21%;

        border-radius: 50%;

        background: #1d1d17;

        pointer-events: none;
    }


    .hue-handle {

        position: absolute;

        width: 22px;

        height: 22px;

        border-radius: 50%;

        border: 3px solid white;

        box-shadow:
            0 0 0 2px
            rgba(0,0,0,0.7);

        transform:
            translate(-50%, -50%);

        pointer-events: none;

        z-index: 3;
    }


    /* =====================================================
       SATURATION / VALUE
    ===================================================== */

    .sv-square {

        width: 205px;

        max-width: 100%;

        aspect-ratio: 1;

        margin: 10px auto;

        position: relative;

        border-radius: 8px;

        overflow: hidden;

        cursor: crosshair;

        touch-action: none;

        user-select: none;

        background:
            linear-gradient(
                to top,
                #000,
                transparent
            ),
            linear-gradient(
                to right,
                #fff,
                red
            );
    }


    .sv-handle {

        position: absolute;

        width: 20px;

        height: 20px;

        border-radius: 50%;

        border: 3px solid white;

        box-shadow:
            0 0 0 2px
            rgba(0,0,0,0.7);

        transform:
            translate(-50%, -50%);

        pointer-events: none;
    }


    .picker-preview {

        width: 100%;

        height: 42px;

        border-radius: 8px;

        border: 2px solid #444;

        margin: 10px 0;
    }


    #hexInput {

        width: 100% !important;

        margin: 8px 0 !important;

        text-align: center;

        text-transform: uppercase;

        font-family: monospace;

        letter-spacing: 1px;
    }


    .picker-buttons {

        display: flex;

        gap: 10px;

        margin-top: 12px;
    }


    .picker-buttons button {

        flex: 1;

        padding: 12px;

        border-radius: 9px;

        border: 1px solid #444;

        background: #2a2a22;

        color: white;

        font-weight: bold;

        cursor: pointer;
    }


    #applyColor {

        background:
            var(--border-color);
    }


    .picker-buttons button:hover {

        transform:
            translateY(-1px);
    }


    /* =====================================================
       SLIDERS
    ===================================================== */

    .sliders-group {

        display: none;

        flex-direction: column;

        width: 98%;

        margin: 15px auto;

        background: #0a0a08;

        border-radius: 12px;

        padding: 15px 0;

        border: 1px solid #333;

        overflow-x: auto;

        white-space: nowrap;

        box-sizing: border-box;

        -webkit-overflow-scrolling:
            touch;
    }


    .sliders-group h4 {

        text-align: center;

        width: 100%;

        margin: 0 0 15px 0;

        color: var(--text-muted);

        font-size: 12px;

        text-transform: uppercase;
    }


    .sliders-wrapper {

        display: flex;

        gap: 18px;

        padding: 0 20px;

        width: max-content;

        margin: 0 auto;
    }


    .slider-col {

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 12px;

        min-width: 35px;

        flex-shrink: 0;
    }


    .slider-col span {

        font-weight: bold;

        font-size: 18px;

        color: #00ffcc;

        transition: color 0.3s;

        max-width: 40px;

        overflow: hidden;
    }


    .slider-col input[type="range"] {

        -webkit-appearance:
            slider-vertical;

        writing-mode: bt-lr;

        height: 60px;

        width: 20px;

        cursor: pointer;

        accent-color:
            var(--border-color);

        touch-action: pan-x;
    }


    /* =====================================================
       PREVIEW
    ===================================================== */

    #preview {

        font-size: 32px;

        padding: 25px 20px;

        background: #0a0a08;

        border-radius: 12px;

        width: 98%;

        display: block;

        text-align: center;

        overflow-x: auto;

        white-space: nowrap;

        box-shadow:
            inset 0 0 15px
            rgba(255,255,255,0.02);

        border: 1px solid #222;

        box-sizing: border-box;

        margin: 20px auto;

        -webkit-overflow-scrolling:
            touch;

        direction: ltr;

        unicode-bidi: bidi-override;

        font-variant-ligatures: none;
    }


    #preview span {

        display: inline;

        position: relative;

        transition:
            color 0.4s ease;

        unicode-bidi: bidi-override;
    }


    .preview-sup {

        top: -6px;

        font-size: 0.85em;
    }


    .preview-sub {

        top: 6px;

        font-size: 0.85em;
    }


    /* =====================================================
       OUTPUT
    ===================================================== */

    #output {

        background: #0a0a08;

        padding: 15px;

        word-break: break-all;

        font-family: monospace;

        color: #00ffcc;

        border-radius: 8px;

        cursor: pointer;

        border: 1px dashed #444;

        transition: all 0.2s;

        font-size: 14px;

        margin-bottom: 5px;

        user-select: none;

        width: 98%;

        box-sizing: border-box;

        overflow-x: auto;

        white-space: nowrap;

        -webkit-overflow-scrolling:
            touch;

        direction: ltr;

        text-align: left;

        unicode-bidi: plaintext;
    }


    #output:hover {

        background: #12120e;

        border-color: #00ffcc;

        transform: scale(1.02);
    }


    .copy-hint {

        font-size: 12px;

        color: #777;

        margin-top: 0;

        margin-bottom: 20px;

        user-select: none;
    }


    sup {

        position: relative;

        top: -0.15em;

        font-size: 0.8em;
    }


    sub {

        position: relative;

        bottom: -0.15em;

        font-size: 0.8em;
    }


    /* =====================================================
       NOTIFICATION
    ===================================================== */

    #secretBanner {

        position: fixed;

        top: -70px;

        left: 50%;

        transform:
            translateX(-50%);

        background:
            linear-gradient(
                45deg,
                #6A5ACD,
                #FF69B4
            );

        color: white;

        padding: 10px 25px;

        border-radius: 30px;

        font-weight: bold;

        font-size: 14px;

        box-shadow:
            0 5px 15px
            rgba(0,0,0,0.5);

        transition:
            top 0.5s
            cubic-bezier(
                0.175,
                0.885,
                0.32,
                1.275
            );

        z-index: 13000;

        pointer-events: none;

        white-space: nowrap;
    }


    #secretBanner.show {

        top: 30px;
    }


    /* =====================================================
       ANIMATION
    ===================================================== */

    @keyframes shake {

        0%, 100% {
            transform: translateX(0);
        }

        20%, 60% {

            transform:
                translateX(-5px)
                scale(0.98);
        }

        40%, 80% {

            transform:
                translateX(5px)
                scale(1.02);
        }
    }


    .anim-shake {

        animation:
            shake 0.3s
            ease-in-out;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

        body {
            padding: 10px;
        }

        .box {
            padding: 18px 10px;
        }

        h2.title {
            font-size: 19px;
        }

        #preview {
            font-size: 28px;
        }

        .controls {
            grid-template-columns:
                repeat(6, 1fr);
        }

        .controls label {
            min-height: 60px;
            font-size: 12px;
        }

        .hue-wheel,
        .sv-square {

/* =========================================================
   ARABIC DETECTION
========================================================= */

function isArabicChar(char) {

    if (!char)
        return false;


    const code =
        char.codePointAt(0);


    return (

        /* Arabic */
        (code >= 0x0600 &&
         code <= 0x06FF)

        ||

        /* Arabic Supplement */
        (code >= 0x0750 &&
         code <= 0x077F)

        ||

        /* Arabic Extended */
        (code >= 0x08A0 &&
         code <= 0x08FF)

        ||

        /* Presentation Forms A */
        (code >= 0xFB50 &&
         code <= 0xFDFF)

        ||

        /* Presentation Forms B */
        (code >= 0xFE70 &&
         code <= 0xFEFF)

    );
}


/* =========================================================
   TATWEEL
========================================================= */

function isTatweel(char) {

    return char === "ـ";
}


/* =========================================================
   HAS SHAPING FORM
========================================================= */

function hasArabicForm(char) {

    return Object.prototype.hasOwnProperty.call(
        ARABIC_FORMS,
        char
    );
}


/* =========================================================
   COMBINING MARK
========================================================= */

function isCombiningMark(char) {

    if (!char)
        return false;


    return /[\u0300-\u036F\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED]/u
        .test(char);
}


/* =========================================================
   MAKE UNITS
========================================================= */

function makeUnits(text) {

    const chars =
        Array.from(text);

    const units = [];


    for (const char of chars) {

        if (
            isCombiningMark(char) &&
            units.length
        ) {

            units[
                units.length - 1
            ] += char;

        } else {

            units.push(char);
        }
    }


    return units;
}


/* =========================================================
   GET BASE
========================================================= */

function getBase(unit) {

    return Array.from(unit)[0] || "";
}


/* =========================================================
   FIND PREVIOUS REAL ARABIC BASE
========================================================= */

function getPreviousBase(
    units,
    index
) {

    for (
        let i = index - 1;
        i >= 0;
        i--
    ) {

        const base =
            getBase(units[i]);

        if (isTatweel(base))
            continue;

        return base;
    }


    return null;
}


/* =========================================================
   FIND NEXT REAL ARABIC BASE
========================================================= */

function getNextBase(
    units,
    index
) {

    for (
        let i = index + 1;
        i < units.length;
        i++
    ) {

        const base =
            getBase(units[i]);

        if (isTatweel(base))
            continue;

        return base;
    }


    return null;
}


/* =========================================================
   JOIN PREVIOUS
========================================================= */

function joinsPrevious(
    previous,
    current
) {

    if (
        !previous ||
        !current
    )
        return false;


    if (
        isTatweel(previous) ||
        isTatweel(current)
    )
        return false;


    /* Standalone hamza never joins on either side.
       Keep every other Arabic joining rule unchanged. */
    if (
        previous === "ء" ||
        current === "ء"
    )
        return false;


    if (
        !hasArabicForm(previous) ||
        !hasArabicForm(current)
    )
        return false;


    return !ARABIC_NON_JOINING.has(
        previous
    );
}


/* =========================================================
   JOIN NEXT
========================================================= */

function joinsNext(
    current,
    next
) {

    if (
        !current ||
        !next
    )
        return false;


    if (
        isTatweel(current) ||
        isTatweel(next)
    )
        return false;


    /* Standalone hamza never joins on either side.
       Keep every other Arabic joining rule unchanged. */
    if (
        current === "ء" ||
        next === "ء"
    )
        return false;


    if (
        !hasArabicForm(current) ||
        !hasArabicForm(next)
    )
        return false;


    return !ARABIC_NON_JOINING.has(
        current
    );
}


/* =========================================================
   SHAPE ARABIC RUN
========================================================= */

function shapeArabicRun(units) {

    const result = [];


    for (
        let i = 0;
        i < units.length;
        i++
    ) {

        const unit =
            units[i];

        const base =
            getBase(unit);

        const marks =
            unit.slice(base.length);


        if (isTatweel(base)) {

            result.push(unit);

            continue;
        }


        if (
            !hasArabicForm(base)
        ) {

            result.push(unit);

            continue;
        }


        if (
            base === "ل" &&
            i + 1 < units.length
        ) {
            const nextUnit = units[i + 1];
            const nextBase = getBase(nextUnit);

            if (LAM_ALEF[nextBase]) {
                const previousBase =
                    getPreviousBase(units, i);

                result.push(
                    (
                        joinsPrevious(previousBase, "ل")
                            ? LAM_ALEF[nextBase].final
                            : LAM_ALEF[nextBase].isolated
                    ) +
                    marks +
                    nextUnit.slice(nextBase.length)
                );

                i++;
                continue;
            }
        }


        const previousBase =
            getPreviousBase(
                units,
                i
            );


        const nextBase =
            getNextBase(
                units,
                i
            );


        const connectPrev =
            joinsPrevious(
                previousBase,
                base
            );


        const connectNext =
            joinsNext(
                base,
                nextBase
            );


        let formIndex;


        if (
            connectPrev &&
            connectNext
        ) {

            formIndex = 3;

        } else if (
            connectPrev
        ) {

            formIndex = 1;

        } else if (
            connectNext
        ) {

            formIndex = 2;

        } else {

            formIndex = 0;
        }


        result.push(
            ARABIC_FORMS[
                base
            ][formIndex] +
            marks
        );
    }


    return result;
}


/* =========================================================
   PROCESS ONE ARABIC RUN
========================================================= */

function processArabicRun(
    units
) {

    const shaped =
        shapeArabicRun(
            units
        );


    shaped.reverse();


    return shaped.map(unit => {
        const base = getBase(unit);
        const marks = unit.slice(base.length);

        if (hasArabicForm(base)) {
            const forms = ARABIC_FORMS[base];
            const rawChar = unit.slice(0, unit.length - marks.length);

            if (rawChar === forms[2]) {
                return forms[1] + marks;
            }
            if (rawChar === forms[1]) {
                return forms[2] + marks;
            }
        }

        /*
         * IMPORTANT:
         * Do not swap LAM-ALEF here.
         *
         * shapeArabicRun() already creates the correct LAM-ALEF
         * presentation form for the original Arabic word.
         * After reversing the glyph sequence for Car Parking,
         * the final LAM-ALEF form (ﻼ / ﻸ / ﻺ / ﻶ) must stay
         * as-is. Swapping it to the isolated form (ﻻ / ﻷ / ﻹ / ﻵ)
         * breaks words such as "السلام".
         */
        return unit;
    });
}


/* =========================================================
   ARABIC WORD
========================================================= */

function isArabicWordToken(token) {

    const units =
        makeUnits(token);

    return (
        units.length > 0 &&
        units.every(unit => {

            const base =
                getBase(unit);

            return (
                isArabicChar(base) &&
                (
                    hasArabicForm(base) ||
                    isTatweel(base)
                )
            );
        })
    );
}


function processArabicWord(token) {

    return processArabicRun(
        makeUnits(token)
    );
}


/* =========================================================
   PROCESS NON-ARABIC TOKEN
========================================================= */

function processNonArabicToken(token) {

    const units =
        makeUnits(token);

    const output = [];

    let currentArabicRun = [];


    function flushArabicRun() {

        if (!currentArabicRun.length)
            return;

        output.push(
            ...processArabicRun(
                currentArabicRun
            )
        );

        currentArabicRun = [];
    }


    for (const unit of units) {

        const base =
            getBase(unit);

        if (
            isArabicChar(base) &&
            (
                hasArabicForm(base) ||
                isTatweel(base)
            )
        ) {
            currentArabicRun.push(unit);
            continue;
        }

        flushArabicRun();
        output.push(unit);
    }


    flushArabicRun();

    return output;
}


/* =========================================================
   PROCESS TEXT
========================================================= */

function processTextByCharacter(text) {

    const parts =
        text.split(/(\s+)/u);

    const output = [];

    let i = 0;

    while (i < parts.length) {

        const part = parts[i];

        if (!part) {
            i++;
            continue;
        }

        if (/^\s+$/u.test(part)) {
            output.push(...Array.from(part));
            i++;
            continue;
        }

        if (isArabicWordToken(part)) {
            let arabicRunTokens = [];
            while (i < parts.length) {
                if (isArabicWordToken(parts[i])) {
                    arabicRunTokens.push({ type: 'word', text: parts[i] });
                    i++;
                } else if (/^\s+$/u.test(parts[i]) && i + 1 < parts.length && isArabicWordToken(parts[i + 1])) {
                    arabicRunTokens.push({ type: 'space', text: parts[i] });
                    i++;
                } else {
                    break;
                }
            }

            arabicRunTokens.reverse();

            for (const item of arabicRunTokens) {
                if (item.type === 'word') {
                    output.push(...processArabicWord(item.text));
                } else {
                    output.push(...Array.from(item.text));
                }
            }
            continue;
        }

        output.push(
            ...processNonArabicToken(part)
        );

        i++;
    }

    return output;
}


/* =========================================================
   TRANSFORM
========================================================= */

function transformText(text) {

    return processTextByCharacter(
        text
    );
}


/* =========================================================
   COLORS
========================================================= */

function hslToHex(
    h,
    s,
    l
) {

    l /= 100;


    const a =
        s *
        Math.min(
            l,
            1 - l
        ) /
        100;


    const f = n => {

        const k =
            (n + h / 30) % 12;


        const color =
            l -
            a *
            Math.max(
                Math.min(
                    k - 3,
                    9 - k,
                    1
                ),
                -1
            );


        return Math
            .round(
                255 * color
            )
            .toString(16)
            .padStart(2, "0");
    };


    return (
        f(0) +
        f(8) +
        f(4)
    ).toUpperCase();
}


/* =========================================================
   HEX TO RGB
========================================================= */

function hexToRgb(hex) {

    hex =
        hex
            .replace("#", "")
            .padEnd(6, "0");


    return {

        r:
            parseInt(
                hex.substring(0, 2),
                16
            ),

        g:
            parseInt(
                hex.substring(2, 4),
                16
            ),

        b:
            parseInt(
                hex.substring(4, 6),
                16
            )

    };
}


/* =========================================================
   INTERPOLATE COLOR
========================================================= */

function interpolateColor(
    hex1,
    hex2,
    factor
) {

    const a =
        hexToRgb(hex1);

    const b =
        hexToRgb(hex2);


    return (

        Math.round(
            a.r +
            factor *
            (b.r - a.r)
        )
        .toString(16)
        .padStart(2, "0")


        +


        Math.round(
            a.g +
            factor *
            (b.g - a.g)
        )
        .toString(16)
        .padStart(2, "0")


        +


        Math.round(
            a.b +
            factor *
            (b.b - a.b)
        )
        .toString(16)
        .padStart(2, "0")

    ).toUpperCase();
}


/* =========================================================
   CALCULATE COLOR
========================================================= */

function calculateColor(
    index,
    length
) {

    const mode =
        gradientMode.value;


    const v1 =
        c1.value
            .replace("#", "")
            .toUpperCase();


    const v2 =
        c2.value
            .replace("#", "")
            .toUpperCase();


    const v3 =
        c3.value
            .replace("#", "")
            .toUpperCase();


    if (
        mode === "rainbow"
    ) {

        return hslToHex(

            length > 1
                ? (
                    index /
                    (length - 1)
                  ) *
                  300
                : 0,

            100,

            50
        );
    }


    if (
        mode === "random"
    ) {

        while (
            randomColors.length <= index
        ) {

            randomColors.push(

                Math
                    .floor(
                        Math.random() *
                        16777215
                    )
                    .toString(16)
                    .padStart(6, "0")
                    .toUpperCase()
            );
        }


        return randomColors[index];
    }

    if (
        mode === "perchar"
    ) {
        return (
            customCharColors[index] ||
            v1
        ).replace("#", "").toUpperCase();
    }


    if (
        mode === "mono"
    )
        return v1;


    if (
        mode === "alt"
    ) {

        return (
            index % 2 === 0
                ? v1
                : v2
        );
    }


    const factor =
        length > 1
            ? index / (length - 1)
            : 0;


    if (
        mode === "grad2"
    ) {

        return interpolateColor(
            v1,
            v2,
            factor
        );
    }


    if (
        mode === "grad3"
    ) {

        return factor <= 0.5

            ? interpolateColor(
                v1,
                v2,
                factor * 2
              )

            : interpolateColor(
                v2,
                v3,
                (factor - 0.5) * 2
              );
    }


    return "FFFFFF";
}


/* =========================================================
   ELEVATION
========================================================= */

function calculateElevation(
    index,
    length
) {

    const mode =
        elevationMode.value;


    if (
        mode === "normal"
    )
        return 0;


    if (
        mode === "jump"
    ) {

        return (
            index % 2 === 0
                ? 0
                : 1
        );
    }


    const factor =
        length > 1
            ? index / (length - 1)
            : 0;


    if (
        mode === "rise"
    ) {

        return (
            Math.round(
                factor * 2
            ) - 1
        );
    }


    if (
        mode === "fall"
    ) {

        return (
            Math.round(
                (1 - factor) * 2
            ) - 1
        );
    }


    if (
        mode === "wave"
    ) {

        return Math.round(
            Math.sin(
                factor *
                Math.PI *
                2
            )
        );
    }


    if (
        mode === "custom"
    ) {

        return (
            customElevations[index] ||
            0
        );
    }


    return 0;
}


/* =========================================================
   SMALLNESS
========================================================= */

function calculateSmallness(
    index,
    length
) {

    const mode =
        smallnessMode.value;


    if (
        mode === "all_normal"
    )
        return 0;


    if (
        mode === "all_small"
    )
        return 1;


    if (
        mode === "jump"
    ) {

        return (
            index % 2 === 0
                ? 0
                : 1
        );
    }


    if (
        mode === "custom"
    ) {

        return (
            customSmallness[index] ||
            0
        );
    }


    return 0;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================================================
   DRAW SLIDERS
========================================================= */

function drawSliders(
    type,
    wrapper,
    arr,
    text
) {

    const isCustom =

        (
            type === "elevation" &&
            elevationMode.value === "custom"
        )

        ||

        (
            type === "smallness" &&
            smallnessMode.value === "custom"
        );


    if (!isCustom) {

        wrapper.parentElement.style.display =
            "none";

        return;
    }


    wrapper.parentElement.style.display =
        "flex";


    let html = "";


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const val =
            arr[i] || 0;


        const min =
            type === "elevation"
                ? -1
                : 0;


        html += `

            <div class="slider-col">

                <span>
                    ${escapeHTML(text[i])}
                </span>

                <input
                    type="range"
                    min="${min}"
                    max="1"
                    value="${val}"
                    data-idx="${i}"
                    data-type="${type}"
                >

            </div>
        `;
    }


    wrapper.innerHTML =
        html;


    wrapper
        .querySelectorAll(
            "input"
        )
        .forEach(inp => {

            inp.addEventListener(
                "input",
                sliderHandler
            );

            inp.addEventListener(
                "change",
                sliderHandler
            );

        });
}


/* =========================================================
   SLIDER HANDLER
========================================================= */

function sliderHandler(e) {

    const idx =
        parseInt(
            e.target.dataset.idx,
            10
        );


    const val =
        parseInt(
            e.target.value,
            10
        );


    if (
        e.target.dataset.type ===
        "elevation"
    ) {

        customElevations[idx] =
            val;

    } else {

        customSmallness[idx] =
            val;
    }


    generateCode(
        transformText(
            input.value
        )
    );
}


/* =========================================================
   UPDATE COLOR SWATCHES
========================================================= */

function updateColorSwatches() {

    swatch1.style.background =
        c1.value;

    swatch2.style.background =
        c2.value;

    swatch3.style.background =
        c3.value;
}

function drawCustomColors(text) {
    if (gradientMode.value !== "perchar") {
        customColorsPanel.classList.remove("visible");
        customColorsPanel.innerHTML = "";
        return;
    }

    customColorsPanel.classList.add("visible");
    customColorsPanel.innerHTML = "";

    let index = 0;
    for (const char of text) {
        if (char === " ") continue;

        const charIndex = index;
        const color =
            customCharColors[index] ||
            c1.value ||
            "#FF0000";

        customCharColors[index] = color;

        const item = document.createElement("div");
        item.className = "character-color";

        const label = document.createElement("span");
        label.innerText = char;

        const swatch = document.createElement("button");
        swatch.type = "button";
        swatch.style.background = color;
        swatch.title = color;

        const colorInput = document.createElement("input");
        colorInput.type = "color";
        colorInput.value = color;
        colorInput.hidden = true;

        swatch.onclick = () => {
            openColorPicker(colorInput);
            pickerCustomApply = () => {
                customCharColors[charIndex] = colorInput.value;
                drawCustomColors(text);
                generateCode(transformText(input.value));
            };
        };

        item.append(label, swatch, colorInput);
        customColorsPanel.appendChild(item);
        index++;
    }
}


/* =========================================================
   UPDATE UI
========================================================= */

function updateUI() {

    const gMode =
        gradientMode.value;


    box1.style.display =

        (
            gMode === "rainbow" ||
            gMode === "random" ||
            gMode === "perchar"
        )

            ? "none"
            : "flex";


    box2.style.display =

        (
            gMode === "mono" ||
            gMode === "rainbow" ||
            gMode === "random" ||
            gMode === "perchar"
        )

            ? "none"
            : "flex";


    box3.style.display =

        gMode === "grad3"
            ? "flex"
            : "none";


    updateColorSwatches();

    const processed =
        transformText(
            input.value
        );

    drawCustomColors(
        processed
            .filter(char => char !== " ")
            .join("")
    );


    const textForSliders =
        processed
            .filter(
                x =>
                    x !== " "
            )
            .join("");


    drawSliders(
        "elevation",
        slidersWrapperElevation,
        customElevations,
        textForSliders
    );


    drawSliders(
        "smallness",
        slidersWrapperSmallness,
        customSmallness,
        textForSliders
    );


    generateCode(
        processed
    );
}


function enhanceSelect(select) {
    const wrapper = document.createElement("div");
    wrapper.className = "bubble-select";

    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "bubble-select-trigger";

    const options = document.createElement("div");
    options.className = "bubble-options";

    select.classList.add("bubble-select-native");
    select.parentNode.insertBefore(wrapper, select);
    wrapper.append(select, trigger, options);

    const refresh = () => {
        const selected = select.options[select.selectedIndex];
        trigger.innerText = selected ? selected.textContent.trim() : "";
        options.querySelectorAll(".bubble-option").forEach(button => {
            button.classList.toggle("is-active", button.dataset.value === select.value);
        });
    };

    Array.from(select.options).forEach(option => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "bubble-option";
        button.dataset.value = option.value;
        button.innerText = option.textContent.trim();
        button.onclick = () => {
            select.value = option.value;
            select.dispatchEvent(new Event("input", { bubbles: true }));
            select.dispatchEvent(new Event("change", { bubbles: true }));
            wrapper.classList.remove("is-open");
            refresh();
        };
        options.appendChild(button);
    });

    trigger.onclick = event => {
        event.stopPropagation();
        document.querySelectorAll(".bubble-select.is-open").forEach(other => {
            if (other !== wrapper) other.classList.remove("is-open");
        });
        wrapper.classList.toggle("is-open");
    };

    wrapper.refresh = refresh;
    refresh();
    return wrapper;
}

const bubbleSelects = [
    enhanceSelect(gradientMode),
    enhanceSelect(elevationMode),
    enhanceSelect(smallnessMode)
];

document.addEventListener("click", () => {
    document.querySelectorAll(".bubble-select.is-open").forEach(wrapper => {
        wrapper.classList.remove("is-open");
    });
});

function cleanUnusedColorCodes(code) {
    let cleaned = code;
    let previous;

    do {
        previous = cleaned;
        cleaned = cleaned.replace(
            /\[[0-9A-F]{6}\](?=\[[0-9A-F]{6}\])/g,
            ""
        );
    } while (cleaned !== previous);

    return cleaned.replace(
        /\[[0-9A-F]{6}\]$/g,
        ""
    );
}

/* =========================================================
   GENERATE CODE
========================================================= */

function generateCode(
    processedText
) {

    let resCode = "";

    let resPreview = "";


    if (
        bold.checked
    )
        resCode += "[b]";


    if (
        italic.checked
    )
        resCode += "[i]";


    if (
        underline.checked
    )
        resCode += "[u]";


    if (
        strike.checked
    )
        resCode += "[s]";


    if (
        colorList.checked
    )
        resCode += "[C]";


    let lastHex = "";

    let charIdx = 0;


    const textLenNoSpaces =
        processedText.filter(
            char =>
                char !== " "
        ).length;


    for (
        let i = 0;
        i < processedText.length;
        i++
    ) {

        const originalChar =
            processedText[i];


        if (
            originalChar === " "
        ) {
            resCode += " ";
            resPreview += " ";

            continue;
        }


        const currentHex =
            calculateColor(
                charIdx,
                textLenNoSpaces
            );


        const elev =
            calculateElevation(
                charIdx,
                textLenNoSpaces
            );


        if (
            currentHex !== lastHex
        ) {

            resCode +=
                `[${currentHex}]`;

            lastHex =
                currentHex;
        }


        let finalChar =
            originalChar;


        if (
            calculateSmallness(
                charIdx,
                textLenNoSpaces
            ) === 1
        ) {

            finalChar =
                smallMap[
                    originalChar
                ] ||
                originalChar;
        }


        if (
            elev === 1
        ) {

            resCode +=
                `[sup]${finalChar}[/sup]`;

        } else if (
            elev === -1
        ) {

            resCode +=
                `[sub]${finalChar}[/sub]`;

        } else {

            resCode +=
                finalChar;
        }


        let previewClass = "";


        if (
            elev === 1
        ) {

            previewClass =
                "preview-sup";

        } else if (
            elev === -1
        ) {

            previewClass =
                "preview-sub";
        }


        const textDeco = [];


        if (
            underline.checked
        )
            textDeco.push(
                "underline"
            );


        if (
            strike.checked
        )
            textDeco.push(
                "line-through"
            );


        const decoStyle =
            textDeco.length

                ? `text-decoration:${textDeco.join(" ")};`

                : "";


        const htmlChar =
            `<span
                class="preview-char ${previewClass}"
                style="
                    color:#${currentHex};
                    ${decoStyle}
                "
            >${escapeHTML(finalChar)}</span>`;


        resPreview +=
            htmlChar;


        charIdx++;
    }


    let htmlPreStart = "";

    let htmlPreEnd = "";


    if (
        bold.checked
    ) {

        htmlPreStart +=
            "<b>";

        htmlPreEnd =
            "</b>" +
            htmlPreEnd;
    }


    if (
        italic.checked
    ) {

        htmlPreStart +=
            "<i>";

        htmlPreEnd =
            "</i>" +
            htmlPreEnd;
    }


    preview.innerHTML =
        htmlPreStart +
        resPreview +
        htmlPreEnd;


    currentGeneratedCode =
        cleanUnusedColorCodes(resCode);


    output.innerText =
        currentGeneratedCode;
}

/* =========================================================
   CONTROLS

/* =========================================================
   CUSTOM COLOR PICKER
========================================================= */

const colorPickerModal =
    document.getElementById(
        "colorPickerModal"
    );

const hueWheel =
    document.getElementById(
        "hueWheel"
    );

const hueHandle =
    document.getElementById(
        "hueHandle"
    );

const svSquare =
    document.getElementById(
        "svSquare"
    );

const svHandle =
    document.getElementById(
        "svHandle"
    );

const pickerPreview =
    document.getElementById(
        "pickerPreview"
    );

const hexInput =
    document.getElementById(
        "hexInput"
    );

const applyColor =
    document.getElementById(
        "applyColor"
    );

const cancelColor =
    document.getElementById(
        "cancelColor"
    );

const closeColorPicker =
    document.getElementById(
        "closeColorPicker"
    );


let pickerTarget = null;

let pickerHue = 0;

let pickerSaturation = 1;

let pickerValue = 1;

let pickerCustomApply = null;


/* =========================================================
   CLAMP
========================================================= */

function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


/* =========================================================
   HEX → HSV
========================================================= */

function hexToHSV(hex) {

    let value =
        hex
            .replace("#", "")
            .trim();


    if (
        !/^[0-9a-fA-F]{6}$/.test(value)
    ) {

        value =
            "6A5ACD";
    }


    const r =
        parseInt(
            value.substring(0, 2),
            16
        ) / 255;


    const g =
        parseInt(
            value.substring(2, 4),
            16
        ) / 255;


    const b =
        parseInt(
            value.substring(4, 6),
            16
        ) / 255;


    const max =
        Math.max(r, g, b);

    const min =
        Math.min(r, g, b);

    const d =
        max - min;


    let h = 0;


    if (d !== 0) {

        if (max === r) {

            h =
                60 *
                (
                    ((g - b) / d) % 6
                );

        } else if (max === g) {

            h =
                60 *
                (
                    (b - r) / d + 2
                );

        } else {

            h =
                60 *
                (
                    (r - g) / d + 4
                );
        }
    }


    if (h < 0)
        h += 360;


    const s =
        max === 0
            ? 0
            : d / max;


    return {
        h,
        s,
        v: max
    };
}


/* =========================================================
   HSV → HEX
========================================================= */

function hsvToHex(
    h,
    s,
    v
) {

    const c =
        v * s;

    const x =
        c *
        (
            1 -
            Math.abs(
                ((h / 60) % 2) - 1
            )
        );

    const m =
        v - c;


    let r = 0;

    let g = 0;

    let b = 0;


    if (h < 60) {

        r = c;

        g = x;

    } else if (h < 120) {

        r = x;

        g = c;

    } else if (h < 180) {

        g = c;

        b = x;

    } else if (h < 240) {

        g = x;

        b = c;

    } else if (h < 300) {

        r = x;

        b = c;

    } else {

        r = c;

        b = x;
    }


    const toHex =
        value =>
            Math.round(
                (value + m) * 255
            )
            .toString(16)
            .padStart(2, "0");


    return (
        "#" +
        toHex(r) +
        toHex(g) +
        toHex(b)
    ).toUpperCase();
}


/* =========================================================
   UPDATE PICKER
========================================================= */

function updatePicker() {

    const color =
        hsvToHex(
            pickerHue,
            pickerSaturation,
            pickerValue
        );


    hexInput.value =
        color;


    pickerPreview.style.background =
        color;


    const pureColor =
        hsvToHex(
            pickerHue,
            1,
            1
        );


    svSquare.style.background =
        `
        linear-gradient(
            to top,
            #000,
            transparent
        ),
        linear-gradient(
            to right,
            #fff,
            ${pureColor}
        )
        `;


    const hueAngle =
        pickerHue *
        Math.PI /
        180;


    const wheelRadius = 43;


    const hueX =
        50 +
        wheelRadius *
        Math.sin(hueAngle);


    const hueY =
        50 -
        wheelRadius *
        Math.cos(hueAngle);


    hueHandle.style.left =
        hueX + "%";


    hueHandle.style.top =
        hueY + "%";


    svHandle.style.left =
        (
            pickerSaturation * 100
        ) + "%";


    svHandle.style.top =
        (
            (1 - pickerValue) * 100
        ) + "%";
}


/* =========================================================
   OPEN COLOR PICKER
========================================================= */

function openColorPicker(
    target
) {

    pickerTarget =
        target;


    const hsv =
        hexToHSV(
            target.value
        );


    pickerHue =
        hsv.h;

    pickerSaturation =
        hsv.s;

    pickerValue =
        hsv.v;


    updatePicker();


    colorPickerModal.style.display =
        "flex";
}


/* =========================================================
   CLOSE COLOR PICKER
========================================================= */

function closePicker() {

    colorPickerModal.style.display =
        "none";

    pickerTarget = null;
    pickerCustomApply = null;
}


/* =========================================================
   HUE POSITION
========================================================= */

function setHueFromPointer(
    event
) {

    const rect =
        hueWheel.getBoundingClientRect();


    const x =
        event.clientX -
        (
            rect.left +
            rect.width / 2
        );


    const y =
        event.clientY -
        (
            rect.top +
            rect.height / 2
        );


    const distance =
        Math.sqrt(
            x * x +
            y * y
        );


    if (
        distance <
        rect.width * 0.25
    )
        return;


    let angle =
        Math.atan2(
            x,
            -y
        ) *
        180 /
        Math.PI;


    if (angle < 0)
        angle += 360;


    pickerHue =
        angle;


    updatePicker();
}


/* =========================================================
   SV POSITION
========================================================= */

function setSVFromPointer(
    event
) {

    const rect =
        svSquare.getBoundingClientRect();


    const x =
        clamp(
            event.clientX -
            rect.left,
            0,
            rect.width
        );


    const y =
        clamp(
            event.clientY -
            rect.top,
            0,
            rect.height
        );


    pickerSaturation =
        x / rect.width;


    pickerValue =
        1 -
        y / rect.height;


    updatePicker();
}


/* =========================================================
   HUE DRAG
========================================================= */

let hueDragging = false;


hueWheel.addEventListener(
    "pointerdown",
    event => {

        hueDragging = true;

        hueWheel.setPointerCapture(
            event.pointerId
        );

        setHueFromPointer(event);
    }
);


hueWheel.addEventListener(
    "pointermove",
    event => {

        if (
            !hueDragging
        )
            return;

        setHueFromPointer(event);
    }
);


hueWheel.addEventListener(
    "pointerup",
    () => {

        hueDragging = false;
    }
);


hueWheel.addEventListener(
    "pointercancel",
    () => {

        hueDragging = false;
    }
);


/* =========================================================
   SV DRAG
========================================================= */

let svDragging = false;


svSquare.addEventListener(
    "pointerdown",
    event => {

        svDragging = true;

        svSquare.setPointerCapture(
            event.pointerId
        );

        setSVFromPointer(event);
    }
);


svSquare.addEventListener(
    "pointermove",
    event => {

        if (
            !svDragging
        )
            return;

        setSVFromPointer(event);
    }
);


svSquare.addEventListener(
    "pointerup",
    () => {

        svDragging = false;
    }
);


svSquare.addEventListener(
    "pointercancel",
    () => {

        svDragging = false;
    }
);


/* =========================================================
   HEX INPUT
========================================================= */

hexInput.addEventListener(
    "input",
    () => {

        let value =
            hexInput.value
                .trim()
                .toUpperCase();


        if (
            !value.startsWith("#")
        ) {

            value =
                "#" + value;
        }


        if (
            /^#[0-9A-F]{6}$/.test(
                value
            )
        ) {

            const hsv =
                hexToHSV(value);


            pickerHue =
                hsv.h;

            pickerSaturation =
                hsv.s;

            pickerValue =
                hsv.v;


            updatePicker();
        }
    }
);


/* =========================================================
   APPLY COLOR
========================================================= */

applyColor.onclick =
    function() {

        if (!pickerTarget)
            return;


        const color =
            hsvToHex(
                pickerHue,
                pickerSaturation,
                pickerValue
            );


        pickerTarget.value =
            color;


        updateColorSwatches();

        if (pickerCustomApply) {
            const callback = pickerCustomApply;
            pickerCustomApply = null;
            callback();
        } else {
            updateUI();
        }

        closePicker();
    };


/* =========================================================
   CANCEL
========================================================= */

cancelColor.onclick =
    closePicker;


closeColorPicker.onclick =
    closePicker;


/* =========================================================
   CLICK OUTSIDE
========================================================= */

colorPickerModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            colorPickerModal
        ) {

            closePicker();
        }
    }
);


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            colorPickerModal.style.display ===
                "flex"
        ) {

            closePicker();
        }
    }
);


/* =========================================================
   COLOR SWATCH BUTTONS
========================================================= */

swatch1.onclick =
    () => openColorPicker(c1);


swatch2.onclick =
    () => openColorPicker(c2);


swatch3.onclick =

/* =========================================================
   SHOW NOTIFICATION
========================================================= */

function showBanner(message) {

    const banner =
        document.getElementById(
            "secretBanner"
        );


    banner.innerText =
        message;


    banner.classList.remove(
        "show"
    );


    void banner.offsetWidth;


    banner.classList.add(
        "show"
    );


    setTimeout(
        () => {

            banner.classList.remove(
                "show"
            );

        },
        1800
    );
}


/* =========================================================
   COPY CHANNEL LINK
========================================================= */

const channelLink =
    document.getElementById(
        "channelLink"
    );


const CHANNEL_URL =
    "https://t.me/MAFYATOKYO";


channelLink.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        let copied = false;


        try {

            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                await navigator.clipboard.writeText(
                    CHANNEL_URL
                );

                copied = true;
            }

        } catch (error) {

            copied = false;
        }


        if (!copied) {

            const textArea =
                document.createElement(
                    "textarea"
                );


            textArea.value =
                CHANNEL_URL;


            textArea.style.position =
                "fixed";

            textArea.style.left =
                "-9999px";

            textArea.style.top =
                "0";

            textArea.style.opacity =
                "0";


            document.body.appendChild(
                textArea
            );


            textArea.focus();

            textArea.select();


            try {

                copied =
                    document.execCommand(
                        "copy"
                    );

            } catch (error) {

                copied = false;
            }


            document.body.removeChild(
                textArea
            );
        }


        if (copied) {

            showBanner(
                translations[
                    currentLang
                ].channelCopied
            );

        } else {

            showBanner(
                CHANNEL_URL
            );
        }

    }
);


/* =========================================================
   COPY GENERATED CODE
========================================================= */

output.onclick =
    async function() {

        const text =
            currentGeneratedCode;


        if (!text)
            return;


        let copied = false;


        try {

            if (
                navigator.clipboard &&
                window.isSecureContext
            ) {

                await navigator.clipboard.writeText(
                    text
                );

                copied = true;
            }

        } catch (error) {

            copied = false;
        }


        if (!copied) {

            const textArea =
                document.createElement(
                    "textarea"
                );


            textArea.value =
                text;


            textArea.style.position =
                "fixed";


            textArea.style.left =
                "-9999px";


            textArea.style.top =
                "0";


            textArea.style.opacity =
                "0";


            document.body.appendChild(
                textArea
            );


            textArea.focus();

            textArea.select();


            textArea.setSelectionRange(
                0,
                textArea.value.length
            );


            try {

                copied =
                    document.execCommand(
                        "copy"
                    );

            } catch (error) {

                copied = false;
            }


            document.body.removeChild(
                textArea
            );
        }


        output.classList.remove(
            "anim-shake"
        );


        void output.offsetWidth;


        output.classList.add(
            "anim-shake"
        );


        if (copied) {

            output.innerText =
                translations[
                    currentLang
                ].copied;


            output.style.color =
                "#fff";


            output.style.background =
                "#4CAF50";


            setTimeout(
                () => {

                    output.innerText =
                        currentGeneratedCode;


                    output.style.color =
                        "#00ffcc";


                    output.style.background =
                        "#0a0a08";

                },

                1500
            );

        } else {

            output.innerText =
                currentGeneratedCode;


            alert(
                currentLang === "ar"
                    ? "تعذر النسخ تلقائيًا. حدد النص ثم اضغط Ctrl+C."
                    : "Automatic copying failed. Select the text and press Ctrl+C."
            );
        }
    };

updateUI();
